<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de HTML para Recibos</title>
</head>
<body style="font-family: 'Arial', sans-serif; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; color: #333;">
    <h2 style="color: #4a5568; font-size: 24px; font-weight: bold; margin-bottom: 20px;">Gerador de HTML para Recibo Offline</h2>
    <form id="empresaForm">
        <label>Nome da Empresa:</label>
        <input type="text" id="nomeEmpresa" class="form-field" required style="width: 100%; max-width: 400px; margin-bottom: 10px; padding: 8px; font-size: 14px; border: 1px solid #cbd5e0; border-radius: 5px;"><br>

        <label>Endereço:</label>
        <input type="text" id="endereco" class="form-field" required style="width: 100%; max-width: 400px; margin-bottom: 10px; padding: 8px; font-size: 14px; border: 1px solid #cbd5e0; border-radius: 5px;"><br>

        <label>Telefone:</label>
        <input type="text" id="telefone" class="form-field" required style="width: 100%; max-width: 400px; margin-bottom: 10px; padding: 8px; font-size: 14px; border: 1px solid #cbd5e0; border-radius: 5px;"><br>

        <label>Logo da Empresa (PNG):</label>
        <input type="file" id="logoUpload" class="form-field" accept="image/png" required style="width: 100%; max-width: 400px; margin-bottom: 10px; padding: 8px; font-size: 14px; border: 1px solid #cbd5e0; border-radius: 5px;"><br>

        <label>Código de Barras:</label>
        <input type="file" id="barcodeUpload" class="form-field" accept="image/webp" required style="width: 100%; max-width: 400px; margin-bottom: 10px; padding: 8px; font-size: 14px; border: 1px solid #cbd5e0; border-radius: 5px;"><br>

        <button type="button" onclick="gerarHtmlPersonalizado()" style="padding: 10px 20px; background-color: #3182ce; color: white; border: none; border-radius: 5px; cursor: pointer; transition: background-color 0.3s ease;"
            onmouseover="this.style.backgroundColor='#2b6cb0'" onmouseout="this.style.backgroundColor='#3182ce'">Gerar HTML Personalizado</button>
    </form>

    <a id="downloadLink" style="display: none; margin-top: 20px; text-decoration: none; color: #48bb78; font-weight: bold;">Baixar HTML Personalizado</a>

    <script src="script.js"></script>
</body>
</html>
