<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Selo Holográfico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Efeito de fundo holográfico animado */
        @keyframes holographic-shine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .holographic-bg {
            background: linear-gradient(-45deg, #a8a8a8, #7f7f7f, #b3cde0, #ffffff, #c9a0dc, #a8a8a8);
            background-size: 400% 400%;
            animation: holographic-shine 6s ease infinite;
        }
        /* Estilo para o input de arquivo */
        input[type="file"]::file-selector-button {
            @apply bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg cursor-pointer transition-colors;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-4xl bg-gray-800 rounded-2xl shadow-2xl p-6 md:p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-gray-300 to-white">Gerador de Selo Holográfico</h1>
            <p class="text-gray-400 mt-2">Crie seu selo personalizado e baixe como PNG ou GIF animado.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
            <!-- Painel de Controles -->
            <div class="flex flex-col space-y-6">
                <div>
                    <label for="logo-upload" class="block mb-2 text-sm font-medium text-gray-300">1. Carregar Logo (PNG transparente)</label>
                    <input id="logo-upload" type="file" accept="image/png, image/jpeg" class="block w-full text-sm text-gray-400 file:mr-4 file:border-0 rounded-lg cursor-pointer">
                </div>

                <div>
                    <label for="title-text" class="block mb-2 text-sm font-medium text-gray-300">2. Título do Selo</label>
                    <input type="text" id="title-text" value="AUTÊNTICO" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
                </div>

                <div class="border-t border-gray-700 pt-6 space-y-4">
                     <h3 class="text-sm font-medium text-gray-300">3. Baixar o Selo</h3>
                    <button id="download-png" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 a 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        <span>Baixar em PNG</span>
                    </button>
                    <button id="download-gif" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        <span>Baixar em GIF Animado</span>
                    </button>
                     <p id="status" class="text-center text-sm text-yellow-400 h-4"></p>
                </div>
            </div>

            <!-- Área de Visualização -->
            <div class="flex items-center justify-center">
                <div id="seal-preview" class="w-64 h-64 md:w-80 md:h-80 rounded-2xl holographic-bg flex flex-col items-center justify-center p-4 shadow-lg overflow-hidden">
                    <img id="logo-preview" src="https://placehold.co/150x150/transparent/white?text=Logo" class="max-w-[60%] max-h-[60%] object-contain" alt="Logo preview" crossorigin="anonymous"/>
                    <p id="title-preview" class="mt-4 text-center text-xl font-bold text-gray-800 tracking-wider uppercase" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.2);">
                        AUTÊNTICO
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Elementos da UI
        const logoUpload = document.getElementById('logo-upload');
        const titleText = document.getElementById('title-text');
        const logoPreview = document.getElementById('logo-preview');
        const titlePreview = document.getElementById('title-preview');
        const sealPreview = document.getElementById('seal-preview');
        const downloadPngBtn = document.getElementById('download-png');
        const downloadGifBtn = document.getElementById('download-gif');
        const statusEl = document.getElementById('status');
        
        let uploadedLogo = null;
        const defaultLogo = new Image();
        defaultLogo.crossOrigin = "anonymous";
        defaultLogo.src = 'https://placehold.co/150x150/transparent/white?text=Logo';
        defaultLogo.onload = () => {
            uploadedLogo = defaultLogo;
        };


        // Atualiza a pré-visualização do logo
        logoUpload.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    logoPreview.src = e.target.result;
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        uploadedLogo = img;
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        // Atualiza a pré-visualização do texto
        titleText.addEventListener('input', (event) => {
            titlePreview.textContent = event.target.value;
        });

        // Função para baixar em PNG
        downloadPngBtn.addEventListener('click', () => {
            statusEl.textContent = 'Gerando PNG...';
            html2canvas(sealPreview, { 
                backgroundColor: null, 
                useCORS: true 
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'selo_holografico.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                statusEl.textContent = 'PNG gerado com sucesso!';
                setTimeout(() => statusEl.textContent = '', 2000);
            }).catch(err => {
                console.error('Erro ao gerar PNG:', err);
                statusEl.textContent = 'Erro ao gerar PNG.';
            });
        });

        // Função de download do GIF agora é assíncrona para lidar com o fetch
        downloadGifBtn.addEventListener('click', async () => {
            if (!uploadedLogo || !uploadedLogo.complete || uploadedLogo.naturalHeight === 0) {
                 statusEl.textContent = 'A imagem do logo ainda está carregando...';
                 setTimeout(()=> statusEl.textContent = '', 2000);
                return;
            }

            statusEl.textContent = 'Gerando GIF animado... (pode levar um momento)';
            downloadPngBtn.disabled = true;
            downloadGifBtn.disabled = true;

            let workerUrl; // Variável para armazenar a URL local do worker

            try {
                // Busca o script do worker, cria um Blob e uma URL local para ele.
                const workerScriptUrl = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js';
                const response = await fetch(workerScriptUrl);
                if (!response.ok) throw new Error('Network response was not ok');
                const workerScriptContent = await response.text();
                const workerBlob = new Blob([workerScriptContent], { type: 'application/javascript' });
                workerUrl = URL.createObjectURL(workerBlob);

                const gif = new GIF({
                    workers: 2,
                    quality: 10,
                    width: 320,
                    height: 320,
                    workerScript: workerUrl // Usa a URL local em vez da URL do CDN
                });

                const canvas = document.createElement('canvas');
                canvas.width = 320;
                canvas.height = 320;
                const ctx = canvas.getContext('2d');

                const totalFrames = 120; // Duração da animação (60fps por 2s)
                const frameDelay = 1000 / 60; // 60fps

                function drawFrame(frame) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    // --- 1. EFEITO HOLOGRÁFICO DE FUNDO ---
                    const baseGradient = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 0, canvas.width / 2, canvas.height / 2, canvas.width * 0.7);
                    baseGradient.addColorStop(0, '#ffffff');
                    baseGradient.addColorStop(0.5, '#e0e8f0');
                    baseGradient.addColorStop(1, '#b3cde0');
                    ctx.fillStyle = baseGradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // --- 2. BRILHO ROTATIVO ---
                    const angle = (frame / (totalFrames / 2)) * Math.PI;
                    const x = Math.cos(angle) * canvas.width * 1.5;
                    const y = Math.sin(angle) * canvas.height * 1.5;
                    const shineGradient = ctx.createLinearGradient(
                        canvas.width / 2 - x, canvas.height / 2 - y,
                        canvas.width / 2, canvas.height / 2
                    );
                    shineGradient.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
                    shineGradient.addColorStop(0.1, 'rgba(220, 230, 255, 0.5)');
                    shineGradient.addColorStop(0.2, 'rgba(255, 255, 255, 0.0)');
                    ctx.globalCompositeOperation = 'lighter';
                    ctx.fillStyle = shineGradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.globalCompositeOperation = 'source-over';

                    // --- 3. GRADE DIAGONAL E PONTOS BRILHANTES ---
                    const gridSpacing = 30;
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.lineWidth = 0.7;
                    for (let i = -canvas.width; i < canvas.width; i += gridSpacing) {
                        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + canvas.height, canvas.height); ctx.stroke();
                    }
                    for (let i = 0; i < canvas.width + canvas.height; i += gridSpacing) {
                        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i - canvas.width); ctx.stroke();
                    }
                    for (let i = 0; i < canvas.width; i += gridSpacing) {
                        for (let j = 0; j < canvas.height; j += gridSpacing) {
                            const sparkle = Math.abs(Math.sin(frame / 15 + i * 0.05 + j * 0.05)) ** 10;
                            if (sparkle > 0.4) {
                                ctx.fillStyle = `rgba(255, 255, 255, ${sparkle})`;
                                ctx.beginPath(); ctx.arc(i, j, sparkle * 2, 0, 2 * Math.PI); ctx.fill();
                            }
                        }
                    }

                    // --- 4. BORDA DE NEON BRANCA ONDULANTE ---
                    const padding = 15;
                    const rectSize = canvas.width - padding * 2;
                    // O gradiente cônico cria um efeito de luz que gira em torno do centro.
                    // O ângulo inicial do gradiente muda a cada frame, criando a "onda".
                    const waveAngle = (frame / totalFrames) * 2 * Math.PI;
                    const waveGradient = ctx.createConicGradient(waveAngle, canvas.width / 2, canvas.height / 2);

                    // Define a onda de luz: transição suave de semi-transparente para opaco e de volta.
                    waveGradient.addColorStop(0, 'rgba(255, 255, 255, 0.3)'); // Ponto inicial fraco
                    waveGradient.addColorStop(0.2, 'rgba(255, 255, 255, 1)');   // Pico da onda
                    waveGradient.addColorStop(0.4, 'rgba(255, 255, 255, 0.3)'); // Ponto final fraco
                    waveGradient.addColorStop(1, 'rgba(255, 255, 255, 0.3)');   // Resto do círculo fraco

                    ctx.strokeStyle = waveGradient;
                    ctx.lineWidth = 4;
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.7)'; // Sombra branca para o brilho neon
                    ctx.shadowBlur = 15; // Aumentar o brilho
                    
                    // Desenha o quadrado fechado (sem animação de traço)
                    ctx.strokeRect(padding, padding, rectSize, rectSize);

                    // Reset
                    ctx.shadowBlur = 0;


                    // --- 5. LOGO ---
                    const logoSize = canvas.width * 0.75;
                    const aspectRatio = uploadedLogo.width / uploadedLogo.height;
                    let logoW = logoSize; let logoH = logoSize / aspectRatio;
                    if (logoH > logoSize) { logoH = logoSize; logoW = logoSize * aspectRatio; }
                    const logoX = (canvas.width - logoW) / 2;
                    const logoY = (canvas.height - logoH) / 2 - (canvas.height * 0.08);
                    ctx.drawImage(uploadedLogo, logoX, logoY, logoW, logoH);

                    // --- 6. TEXTO ---
                    ctx.font = 'bold 28px "Inter", sans-serif';
                    ctx.fillStyle = '#374151';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
                    ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 1; ctx.shadowBlur = 4;
                    ctx.fillText(titleText.value.toUpperCase(), canvas.width / 2, canvas.height * 0.82);
                    ctx.shadowColor = 'transparent';

                    gif.addFrame(canvas, {copy: true, delay: frameDelay});
                }

                for (let i = 0; i < totalFrames; i++) {
                    drawFrame(i);
                }

                gif.on('finished', function(blob) {
                    const link = document.createElement('a');
                    link.download = 'selo_holografico_animado.gif';
                    link.href = URL.createObjectURL(blob);
                    link.click();
                    statusEl.textContent = 'GIF gerado com sucesso!';
                    setTimeout(() => statusEl.textContent = '', 2000);
                    downloadPngBtn.disabled = false;
                    downloadGifBtn.disabled = false;
                    if (workerUrl) URL.revokeObjectURL(workerUrl);
                });

                gif.render();

            } catch (e) {
                console.error("Erro ao gerar GIF:", e);
                statusEl.textContent = 'Ocorreu um erro ao gerar o GIF.';
                downloadPngBtn.disabled = false;
                downloadGifBtn.disabled = false;
                if (workerUrl) URL.revokeObjectURL(workerUrl);
            }
        });
    </script>

</body>
</html>
