<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Imagens em Lote com Marca D'água</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.0/FileSaver.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .file-input-label {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .file-input-label:hover {
            opacity: 0.9;
        }
        .loader {
            border-top-color: #3498db;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 sm:p-6 md:p-8 max-w-5xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-900">📸 Conversor de Imagens em Lote</h1>
            <p class="text-md text-gray-600 mt-2">Adicione marca d'água, redimensione e comprima suas fotos.</p>
        </header>

        <div class="bg-white rounded-xl shadow-lg p-6 sm:p-8 space-y-8">
            <!-- Step 1: Upload Photos -->
            <div id="step1">
                <h2 class="text-xl font-semibold mb-3 text-gray-700">Passo 1: Selecione as Fotos</h2>
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center">
                    <input type="file" id="imageFiles" accept="image/jpeg, image/png" multiple class="hidden">
                    <label for="imageFiles" class="file-input-label inline-block bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-blue-700">
                        Escolher Fotos
                    </label>
                    <p id="imageCount" class="mt-3 text-sm text-gray-500">Nenhuma foto selecionada.</p>
                </div>
            </div>

            <!-- Step 2: Upload Main Watermark -->
            <div id="step2">
                <h2 class="text-xl font-semibold mb-3 text-gray-700">Passo 2: Selecione a Marca D'água Principal</h2>
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center">
                    <input type="file" id="watermarkFile" accept="image/png" class="hidden">
                    <label for="watermarkFile" class="file-input-label inline-block bg-indigo-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-indigo-700">
                        Escolher Marca D'água (Obrigatória)
                    </label>
                    <div id="watermarkPreviewContainer" class="mt-4 hidden">
                        <img id="watermarkPreview" src="#" alt="Pré-visualização da Marca D'água" class="mx-auto max-h-24 rounded-md border p-1"/>
                        <p id="watermarkName" class="mt-2 text-sm text-gray-500"></p>
                    </div>
                </div>
            </div>
            
            <!-- Step 3: Additional Options -->
            <div id="step3">
                 <h2 class="text-xl font-semibold mb-4 text-gray-700">Passo 3: Opções Adicionais</h2>
                 <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- Optional Corner Watermark -->
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center">
                        <label for="cornerWatermarkFile" class="file-input-label inline-block bg-teal-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-teal-700">
                           Marca D'água de Canto (Opcional)
                        </label>
                        <input type="file" id="cornerWatermarkFile" accept="image/png" class="hidden">
                        <div id="cornerWatermarkPreviewContainer" class="mt-4 hidden">
                           <img id="cornerWatermarkPreview" src="#" alt="Pré-visualização da Marca D'água de Canto" class="mx-auto max-h-20 rounded-md border p-1"/>
                           <p id="cornerWatermarkName" class="mt-2 text-sm text-gray-500"></p>
                        </div>
                    </div>
                    <!-- Optional Caption -->
                    <div class="space-y-2">
                        <label for="captionText" class="block text-sm font-medium text-gray-700">Legenda Opcional (Topo, Centralizada)</label>
                        <input type="text" id="captionText" placeholder="Digite sua legenda aqui" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                 </div>
            </div>

            <!-- Step 4: Process Button -->
            <div id="step4" class="text-center border-t border-gray-200 pt-8">
                <button id="processButton" class="w-full sm:w-auto bg-green-600 text-white font-bold py-4 px-10 rounded-lg shadow-lg hover:bg-green-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-all duration-300" disabled>
                    Processar Imagens
                </button>
            </div>

            <!-- Processing Status -->
            <div id="status" class="text-center text-gray-600 font-medium hidden flex items-center justify-center space-x-3">
                 <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
                 <p id="statusText"></p>
            </div>

            <!-- Results Section -->
            <div id="results" class="hidden">
                <div class="flex flex-col sm:flex-row justify-between items-center mb-6 border-t pt-6">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-4 sm:mb-0">Resultados</h2>
                    <button id="downloadAllButton" class="w-full sm:w-auto bg-purple-600 text-white font-bold py-3 px-6 rounded-lg shadow-md hover:bg-purple-700">
                        Baixar Todas (.zip)
                    </button>
                </div>
                <div id="resultGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                    <!-- Processed images will be appended here -->
                </div>
            </div>
        </div>
        
        <footer class="text-center mt-8 text-sm text-gray-500">
            <p>&copy; 2024 Ferramenta de Imagens. Criado para o Grupo Foto de Marca.</p>
        </footer>
    </div>

    <script>
        // DOM Elements
        const imageFilesInput = document.getElementById('imageFiles');
        const watermarkFileInput = document.getElementById('watermarkFile');
        const cornerWatermarkFileInput = document.getElementById('cornerWatermarkFile');
        const processButton = document.getElementById('processButton');
        const imageCount = document.getElementById('imageCount');
        const watermarkPreview = document.getElementById('watermarkPreview');
        const watermarkPreviewContainer = document.getElementById('watermarkPreviewContainer');
        const watermarkName = document.getElementById('watermarkName');
        const cornerWatermarkPreview = document.getElementById('cornerWatermarkPreview');
        const cornerWatermarkPreviewContainer = document.getElementById('cornerWatermarkPreviewContainer');
        const cornerWatermarkName = document.getElementById('cornerWatermarkName');
        const statusDiv = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const resultsDiv = document.getElementById('results');
        const resultGrid = document.getElementById('resultGrid');
        const downloadAllButton = document.getElementById('downloadAllButton');
        const captionTextInput = document.getElementById('captionText');

        let processedImages = [];

        // Function to update the process button state
        const updateButtonState = () => {
            const hasImages = imageFilesInput.files.length > 0;
            const hasWatermark = watermarkFileInput.files.length > 0;
            processButton.disabled = !(hasImages && hasWatermark);
        };

        // Generic function to handle file input changes for previews
        const handleFilePreview = (input, previewImg, previewContainer, nameElement) => {
             if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImg.src = e.target.result;
                    previewContainer.classList.remove('hidden');
                    nameElement.textContent = input.files[0].name;
                };
                reader.readAsDataURL(input.files[0]);
            } else {
                previewContainer.classList.add('hidden');
            }
        };

        // Event Listeners
        imageFilesInput.addEventListener('change', () => {
            const count = imageFilesInput.files.length;
            imageCount.textContent = count > 0 ? `${count} foto(s) selecionada(s).` : 'Nenhuma foto selecionada.';
            updateButtonState();
        });

        watermarkFileInput.addEventListener('change', () => {
            handleFilePreview(watermarkFileInput, watermarkPreview, watermarkPreviewContainer, watermarkName);
            updateButtonState();
        });

        cornerWatermarkFileInput.addEventListener('change', () => {
            handleFilePreview(cornerWatermarkFileInput, cornerWatermarkPreview, cornerWatermarkPreviewContainer, cornerWatermarkName);
        });

        processButton.addEventListener('click', async () => {
            const files = imageFilesInput.files;
            const watermarkFile = watermarkFileInput.files[0];
            const cornerWatermarkFile = cornerWatermarkFileInput.files[0];

            if (files.length === 0 || !watermarkFile) return;

            // Reset UI
            processedImages = [];
            resultGrid.innerHTML = '';
            resultsDiv.classList.add('hidden');
            statusDiv.classList.remove('hidden');
            processButton.disabled = true;

            const mainWatermarkImg = await loadImage(URL.createObjectURL(watermarkFile));
            let cornerWatermarkImg = null;
            if (cornerWatermarkFile) {
                cornerWatermarkImg = await loadImage(URL.createObjectURL(cornerWatermarkFile));
            }

            const options = {
                captionText: captionTextInput.value.trim(),
                cornerWatermarkImg: cornerWatermarkImg
            };

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                statusText.textContent = `Processando imagem ${i + 1} de ${files.length}: ${file.name}`;
                try {
                    const processedData = await processImage(file, mainWatermarkImg, options);
                    displayResult(processedData);
                    processedImages.push(processedData);
                } catch (error) {
                    console.error('Erro ao processar a imagem:', file.name, error);
                }
            }

            // Finalize UI
            statusDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            processButton.disabled = false;
            updateButtonState();
        });
        
        downloadAllButton.addEventListener('click', () => {
            if (processedImages.length === 0) return;
            const zip = new JSZip();
            processedImages.forEach(imgData => {
                const base64Data = imgData.dataUrl.split(',')[1];
                zip.file(imgData.name, base64Data, { base64: true });
            });
            zip.generateAsync({ type: 'blob' }).then(content => {
                saveAs(content, 'FotosComMarca.zip');
            });
        });

        function loadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = url;
            });
        }
        
        async function processImage(file, mainWatermarkImg, options) {
            const MAX_WIDTH = 800;
            const MAX_HEIGHT = 800;
            const TARGET_SIZE_KB = 130;
            const TARGET_SIZE_BYTES = TARGET_SIZE_KB * 1024;

            const originalImage = await loadImage(URL.createObjectURL(file));
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // --- 1. Calculate new dimensions ---
            let width = originalImage.width;
            let height = originalImage.height;
            if (width > height) {
                if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                }
            } else {
                if (height > MAX_HEIGHT) {
                    width *= MAX_HEIGHT / height;
                    height = MAX_HEIGHT;
                }
            }
            canvas.width = width;
            canvas.height = height;

            // --- 2. Draw resized image ---
            ctx.drawImage(originalImage, 0, 0, width, height);

            // --- 3. Draw Main Watermark (Cover) ---
            ctx.globalAlpha = 0.5;
            const canvasAspect = width / height;
            const watermarkAspect = mainWatermarkImg.naturalWidth / mainWatermarkImg.naturalHeight;
            let sx, sy, sWidth, sHeight;
            if (canvasAspect > watermarkAspect) {
                sHeight = mainWatermarkImg.naturalWidth / canvasAspect;
                sWidth = mainWatermarkImg.naturalWidth;
                sx = 0;
                sy = (mainWatermarkImg.naturalHeight - sHeight) / 2;
            } else {
                sWidth = mainWatermarkImg.naturalHeight * canvasAspect;
                sHeight = mainWatermarkImg.naturalHeight;
                sx = (mainWatermarkImg.naturalWidth - sWidth) / 2;
                sy = 0;
            }
            ctx.drawImage(mainWatermarkImg, sx, sy, sWidth, sHeight, 0, 0, width, height);
            ctx.globalAlpha = 1.0;

            const filenameFontSize = Math.max(16, Math.round(width / 35)) * 1.25;
            const padding = filenameFontSize;

            // --- 4. Draw Optional Corner Watermark (Bottom, Left) ---
            if (options.cornerWatermarkImg) {
                const wmWidth = width * 0.25; // Watermark is 25% of the image width
                const wmHeight = wmWidth / (options.cornerWatermarkImg.naturalWidth / options.cornerWatermarkImg.naturalHeight);
                const wmX = padding;
                const wmY = height - wmHeight - padding;
                ctx.globalAlpha = 0.8;
                ctx.drawImage(options.cornerWatermarkImg, wmX, wmY, wmWidth, wmHeight);
                ctx.globalAlpha = 1.0;
            }

            // --- 5. Draw Optional Caption (Top, Centered) ---
            if (options.captionText && options.captionText.length > 0) {
                const captionFontSize = filenameFontSize * 0.65; // 35% smaller
                ctx.font = `bold ${captionFontSize}px Inter, sans-serif`;
                ctx.fillStyle = 'white';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = Math.max(2, captionFontSize / 8);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                const captionX = width / 2;
                const captionY = padding;
                ctx.strokeText(options.captionText, captionX, captionY);
                ctx.fillText(options.captionText, captionX, captionY);
            }

            // --- 6. Draw Filename (Bottom, Right) ---
            const filenameText = file.name.substring(0, file.name.lastIndexOf('.'));
            ctx.font = `bold ${filenameFontSize}px Inter, sans-serif`;
            ctx.fillStyle = 'white';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = Math.max(2, filenameFontSize / 8);
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            const textX = width - padding;
            const textY = height - padding;
            ctx.strokeText(filenameText, textX, textY);
            ctx.fillText(filenameText, textX, textY);

            // --- 7. Compress image to target size ---
            let quality = 0.9;
            let dataUrl;
            let blob;
            for (let i = 0; i < 10; i++) {
                dataUrl = canvas.toDataURL('image/jpeg', quality);
                blob = await (await fetch(dataUrl)).blob();
                if (blob.size <= TARGET_SIZE_BYTES) break;
                quality -= 0.1;
                if (quality < 0.1) quality = 0.1;
            }
            
            return { name: file.name, dataUrl: dataUrl, size: (blob.size / 1024).toFixed(2) };
        }

        function displayResult(imageData) {
            const col = document.createElement('div');
            col.className = 'relative group bg-gray-200 rounded-lg overflow-hidden shadow-md';
            const img = document.createElement('img');
            img.src = imageData.dataUrl;
            img.className = 'w-full h-full object-cover';
            const overlay = document.createElement('div');
            overlay.className = 'absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-60 transition-all duration-300 flex flex-col items-center justify-center p-2 text-white text-center';
            const sizeInfo = document.createElement('p');
            sizeInfo.className = 'text-sm font-bold opacity-0 group-hover:opacity-100 transition-opacity';
            sizeInfo.textContent = `${imageData.size} KB`;
            const downloadLink = document.createElement('a');
            downloadLink.href = imageData.dataUrl;
            downloadLink.download = imageData.name;
            downloadLink.textContent = 'Baixar';
            downloadLink.className = 'mt-2 text-xs bg-blue-600 px-3 py-1 rounded-full opacity-0 group-hover:opacity-100 transition-opacity hover:bg-blue-700';
            overlay.appendChild(sizeInfo);
            overlay.appendChild(downloadLink);
            col.appendChild(img);
            col.appendChild(overlay);
            resultGrid.appendChild(col);
        }
    </script>
</body>
</html>
