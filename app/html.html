    <script>
        const htmlEditor = document.getElementById('htmlEditor');
        const preview = document.getElementById('preview');
        const fileInput = document.getElementById('fileInput');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const refreshBtn = document.getElementById('refreshPreview');
        const statusMessage = document.getElementById('statusMessage');

        // Exemplo inicial
        const initialHTML = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        h1 { color: #333; }
        p { color: #666; line-height: 1.6; }
    </style>
</head>
<body>
    <h1>Bem-vindo ao Editor HTML!</h1>
    <p>Este é um exemplo de código HTML. Você pode:</p>
    <ul>
        <li>Fazer upload de arquivos HTML</li>
        <li>Editar o código diretamente</li>
        <li>Ver a visualização em tempo real</li>
        <li>Copiar ou baixar o resultado</li>
    </ul>
</body>
</html>`;

        htmlEditor.value = initialHTML;
        updatePreview();

        // Atualizar preview em tempo real
        htmlEditor.addEventListener('input', updatePreview);

        function updatePreview() {
            const htmlContent = htmlEditor.value;
            
            // Método mais compatível para mobile
            try {
                // Limpa o iframe primeiro
                preview.src = 'about:blank';
                
                // Aguarda um pouco e então carrega o conteúdo
                setTimeout(() => {
                    const doc = preview.contentDocument || preview.contentWindow.document;
                    doc.open();
                    doc.write(htmlContent);
                    doc.close();
                }, 100);
            } catch (err) {
                // Fallback usando blob URL
                const blob = new Blob([htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                preview.src = url;
                
                // Limpa a URL após um tempo para evitar vazamentos de memória
                setTimeout(() => URL.revokeObjectURL(url), 5000);
            }
        }

        // Upload de arquivo
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    htmlEditor.value = e.target.result;
                    updatePreview();
                    showStatus('Arquivo carregado com sucesso!', 'success');
                };
                reader.readAsText(file);
            }
        });

        // Copiar HTML
        copyBtn.addEventListener('click', async function() {
            try {
                // Primeiro tenta o método moderno
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(htmlEditor.value);
                    showStatus('HTML copiado para a área de transferência!', 'success');
                } else {
                    // Fallback melhorado para mobile
                    htmlEditor.select();
                    htmlEditor.setSelectionRange(0, 99999); // Para mobile
                    
                    const successful = document.execCommand('copy');
                    if (successful) {
                        showStatus('HTML copiado para a área de transferência!', 'success');
                    } else {
                        throw new Error('Falha ao copiar');
                    }
                }
            } catch (err) {
                // Último recurso - criar elemento temporário
                const textArea = document.createElement('textarea');
                textArea.value = htmlEditor.value;
                textArea.style.position = 'fixed';
                textArea.style.left = '-999999px';
                textArea.style.top = '-999999px';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                
                try {
                    document.execCommand('copy');
                    showStatus('HTML copiado para a área de transferência!', 'success');
                } catch (err2) {
                    showStatus('Erro ao copiar. Selecione o texto manualmente.', 'error');
                }
                
                document.body.removeChild(textArea);
            }
        });

        // Download HTML
        downloadBtn.addEventListener('click', function() {
            const htmlContent = htmlEditor.value;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'arquivo.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showStatus('Download iniciado!', 'success');
        });

        // Limpar editor
        clearBtn.addEventListener('click', function() {
            if (confirm('Tem certeza que deseja limpar todo o conteúdo?')) {
                htmlEditor.value = '';
                updatePreview();
                showStatus('Editor limpo!', 'info');
            }
        });

        // Atualizar preview manualmente
        refreshBtn.addEventListener('click', function() {
            updatePreview();
            showStatus('Visualização atualizada!', 'info');
        });

        // Mostrar mensagem de status
        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `mt-4 p-3 rounded-lg ${getStatusClass(type)}`;
            statusMessage.classList.remove('hidden');
            
            setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, 3000);
        }

        function getStatusClass(type) {
            switch(type) {
                case 'success': return 'bg-green-100 text-green-800 border border-green-200';
                case 'error': return 'bg-red-100 text-red-800 border border-red-200';
                case 'info': return 'bg-blue-100 text-blue-800 border border-blue-200';
                default: return 'bg-gray-100 text-gray-800 border border-gray-200';
            }
        }
    </script>
