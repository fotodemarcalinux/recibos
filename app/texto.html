<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Texto</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1.1em;
            resize: vertical;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: #007bff;
            outline: none;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .button-group button {
            flex-grow: 1;
            padding: 12px 20px;
            font-size: 1em;
            font-weight: 600;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            min-width: 120px;
        }

        .button-group button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        .button-group button:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.5em;
            }
            .button-group button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Conversor de Texto</h1>

        <textarea id="inputText" placeholder="Digite ou cole seu texto aqui..."></textarea>

        <div class="button-group">
            <button id="lowercaseBtn">minúscula</button>
            <button id="uppercaseBtn">MAIÚSCULA</button>
            <button id="capitalizeBtn">Capitalizada</button>
            <button id="alternatingBtn">aLtErNaDa</button>
            <button id="reverseBtn">Invertida</button>
        </div>
    </div>

    <script>
        const inputText = document.getElementById('inputText');
        const lowercaseBtn = document.getElementById('lowercaseBtn');
        const uppercaseBtn = document.getElementById('uppercaseBtn');
        const capitalizeBtn = document.getElementById('capitalizeBtn');
        const alternatingBtn = document.getElementById('alternatingBtn');
        const reverseBtn = document.getElementById('reverseBtn');

        function capitalizeText(text) {
            return text.split(' ').map(word => {
                if (word.length === 0) return '';
                return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
            }).join(' ');
        }

        function alternatingText(text) {
            return text.split('').map((char, index) => {
                return index % 2 === 0 ? char.toLowerCase() : char.toUpperCase();
            }).join('');
        }

        function reverseText(text) {
            return text.split('').reverse().join('');
        }

        lowercaseBtn.addEventListener('click', () => {
            inputText.value = inputText.value.toLowerCase();
        });

        uppercaseBtn.addEventListener('click', () => {
            inputText.value = inputText.value.toUpperCase();
        });

        capitalizeBtn.addEventListener('click', () => {
            inputText.value = capitalizeText(inputText.value);
        });

        alternatingBtn.addEventListener('click', () => {
            inputText.value = alternatingText(inputText.value);
        });

        reverseBtn.addEventListener('click', () => {
            inputText.value = reverseText(inputText.value);
        });
    </script>
</body>
</html>
