<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Código de Barras</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            text-align: left;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, select:focus {
            border-color: #007bff;
            outline: none;
        }

        button {
            padding: 12px 20px;
            text-decoration: none;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            font-weight: 600;
            display: inline-block;
            width: 100%;
            margin-bottom: 10px;
        }

        .download-btn-webp {
            background-color: #38c716;
        }

        button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #barcode-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 150px;
            margin: 30px 0;
            background-color: #fff;
        }

        #barcode {
            max-width: 100%;
            height: auto;
        }

        #status-message {
            margin-top: -15px;
            margin-bottom: 15px;
            color: #d9534f;
            font-weight: 600;
            text-align: left;
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gerador de Código de Barras</h1>

        <label for="barcode-text">Digite o texto/número:</label>
        <input type="text" id="barcode-text" placeholder="Ex: GITHUB-12345">

        <label for="barcode-type">Selecione o tipo de código:</label>
        <select id="barcode-type">
            <option value="CODE128">CODE 128</option>
            <option value="CODE39">CODE 39</option>
        </select>

        <button id="generate-btn">Gerar Código</button>

        <p id="status-message"></p>

        <div id="barcode-container">
            <svg id="barcode"></svg>
        </div>

        <button id="download-btn-png">Baixar Código (PNG)</button>
        <button id="download-btn-webp" class="download-btn-webp">Baixar Código (WebP)</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const barcodeText = document.getElementById('barcode-text');
            const barcodeType = document.getElementById('barcode-type');
            const barcodeSvg = document.getElementById('barcode');
            const downloadBtnPng = document.getElementById('download-btn-png');
            const downloadBtnWebp = document.getElementById('download-btn-webp');
            const generateBtn = document.getElementById('generate-btn');
            const statusMessage = document.getElementById('status-message');

            function showStatus(message, isError = true) {
                statusMessage.textContent = message;
                statusMessage.style.display = 'block';
                statusMessage.style.color = isError ? '#d9534f' : '#337ab7';
            }

            function generateBarcode() {
                statusMessage.style.display = 'none';
                let text = barcodeText.value.trim();
                const type = barcodeType.value;

                if (text === '') {
                    barcodeSvg.innerHTML = '';
                    showStatus("Por favor, digite um texto para gerar o código.", false);
                    return;
                }

                try {
                    barcodeSvg.innerHTML = '';
                    JsBarcode(barcodeSvg, text, {
                        format: type,
                        lineColor: "#000000",
                        width: 2,
                        height: 100,
                        displayValue: true
                    });
                    showStatus("Código de barras gerado. Você pode baixar a imagem.", false);
                } catch (e) {
                    barcodeSvg.innerHTML = '';
                    showStatus(`Erro: ${e.message}`);
                }
            }

            function downloadBarcode(format) {
                const svgElement = barcodeSvg;

                if (!svgElement || svgElement.innerHTML.trim() === '') {
                    alert("Nenhum código de barras para baixar! Por favor, gere um primeiro.");
                    return;
                }

                const svgString = new XMLSerializer().serializeToString(svgElement);
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                const img = new Image();

                const exportWidth = 800;
                const exportHeight = 200;
                canvas.width = exportWidth;
                canvas.height = exportHeight;

                img.onload = () => {
                    context.fillStyle = '#fff';
                    context.fillRect(0, 0, canvas.width, canvas.height);
                    context.drawImage(img, 0, 0, exportWidth, exportHeight);

                    let url;
                    let filename;

                    if (format === 'webp') {
                        url = canvas.toDataURL('image/webp');
                        filename = 'codigo-barras.webp';
                    } else {
                        url = canvas.toDataURL('image/png');
                        filename = 'codigo-barras.png';
                    }
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };

                const svgUrl = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svgString)}`;
                img.src = svgUrl;
            }

            generateBtn.addEventListener('click', generateBarcode);
            downloadBtnPng.addEventListener('click', () => downloadBarcode('png'));
            downloadBtnWebp.addEventListener('click', () => downloadBarcode('webp'));
        });
    </script>
</body>
</html>
