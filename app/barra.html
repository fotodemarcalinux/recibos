<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Código de Barras</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        #barcode-container {
            margin: 20px 0;
            text-align: center;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Gerador de Código de Barras</h1>
    
    <input type="text" id="barcode-text" placeholder="Digite o texto" value="TESTE123">
    <select id="barcode-type">
        <option value="CODE128">CODE 128</option>
        <option value="CODE39">CODE 39</option>
    </select>
    
    <div id="barcode-container">
        <svg id="barcode"></svg>
    </div>
    
    <button id="download-btn">Baixar Código de Barras</button>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script>
        // Elementos da página
        const barcodeText = document.getElementById('barcode-text');
        const barcodeType = document.getElementById('barcode-type');
        const barcodeSvg = document.getElementById('barcode');
        const downloadBtn = document.getElementById('download-btn');

        // Gerar código de barras
        function generateBarcode() {
            try {
                JsBarcode(barcodeSvg, barcodeText.value, {
                    format: barcodeType.value,
                    lineColor: "#000000",
                    width: 2,
                    height: 100,
                    displayValue: true
                });
            } catch (e) {
                alert("Erro: " + e.message);
            }
        }

        // Função para download garantido
        function downloadBarcode() {
            const svg = barcodeSvg.querySelector('svg');
            if (!svg) return;
            
            // Cria um canvas
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Define o tamanho do canvas
            canvas.width = svg.width.baseVal.value;
            canvas.height = svg.height.baseVal.value;
            
            // Converte SVG para imagem
            const img = new Image();
            img.onload = function() {
                // Desenha no canvas
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                
                // Cria o link de download
                const link = document.createElement('a');
                link.download = 'codigo-barras.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
            
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(new XMLSerializer().serializeToString(svg))));
        }

        // Event listeners
        barcodeText.addEventListener('input', generateBarcode);
        barcodeType.addEventListener('change', generateBarcode);
        downloadBtn.addEventListener('click', downloadBarcode);

        // Gera código inicial
        generateBarcode();
    </script>
</body>
</html>
