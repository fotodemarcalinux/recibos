<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Cor de fundo do corpo para um melhor contraste */
        .calculator-body {
            background-color: #1a202c; /* bg-gray-900 */
        }
        /* Estilo para os botões para melhor feedback tátil */
        .btn {
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-gray-800 flex items-center justify-center h-screen">

    <!-- Container Principal da Calculadora -->
    <div class="calculator-body w-full max-w-sm mx-auto shadow-2xl rounded-2xl p-6 border-4 border-gray-700">

        <!-- Visor da Calculadora -->
        <div class="output mb-6">
            <input id="display" type="text" readonly class="w-full bg-gray-800 text-white text-5xl text-right pr-4 py-4 rounded-lg border-2 border-gray-700 focus:outline-none" placeholder="0">
        </div>

        <!-- Grade de Botões -->
        <div class="buttons grid grid-cols-4 gap-4">
            <!-- Linha 1 -->
            <button onclick="clearDisplay()" class="btn text-2xl font-bold text-white bg-gray-600 hover:bg-gray-700 p-4 rounded-lg">C</button>
            <button onclick="appendToDisplay('/')" class="btn text-2xl font-bold text-white bg-orange-500 hover:bg-orange-600 p-4 rounded-lg">÷</button>
            <button onclick="appendToDisplay('*')" class="btn text-2xl font-bold text-white bg-orange-500 hover:bg-orange-600 p-4 rounded-lg">×</button>
            <button onclick="deleteLast()" class="btn text-2xl font-bold text-white bg-gray-600 hover:bg-gray-700 p-4 rounded-lg">DEL</button>

            <!-- Linha 2 -->
            <button onclick="appendToDisplay('7')" class="btn text-2xl font-bold text-white bg-gray-700 hover:bg-gray-800 p-4 rounded-lg">7</button>
            <button onclick="appendToDisplay('8')" class="btn text-2xl font-bold text-white bg-gray-700 hover:bg-gray-800 p-4 rounded-lg">8</button>
            <button onclick="appendToDisplay('9')" class="btn text-2xl font-bold text-white bg-gray-700 hover:bg-gray-800 p-4 rounded-lg">9</button>
            <button onclick="appendToDisplay('-')" class="btn text-2xl font-bold text-white bg-orange-500 hover:bg-orange-600 p-4 rounded-lg">-</button>

            <!-- Linha 3 -->
            <button onclick="appendToDisplay('4')" class="btn text-2xl font-bold text-white bg-gray-700 hover:bg-gray-800 p-4 rounded-lg">4</button>
            <button onclick="appendToDisplay('5')" class="btn text-2xl font-bold text-white bg-gray-700 hover:bg-gray-800 p-4 rounded-lg">5</button>
            <button onclick="appendToDisplay('6')" class="btn text-2xl font-bold text-white bg-gray-700 hover:bg-gray-800 p-4 rounded-lg">6</button>
            <button onclick="appendToDisplay('+')" class="btn text-2xl font-bold text-white bg-orange-500 hover:bg-orange-600 p-4 rounded-lg">+</button>
            
            <!-- Linha 4 -->
            <button onclick="appendToDisplay('1')" class="btn text-2xl font-bold text-white bg-gray-700 hover:bg-gray-800 p-4 rounded-lg">1</button>
            <button onclick="appendToDisplay('2')" class="btn text-2xl font-bold text-white bg-gray-700 hover:bg-gray-800 p-4 rounded-lg">2</button>
            <button onclick="appendToDisplay('3')" class="btn text-2xl font-bold text-white bg-gray-700 hover:bg-gray-800 p-4 rounded-lg">3</button>
            <button onclick="calculateResult()" class="btn text-2xl font-bold text-white bg-orange-500 hover:bg-orange-600 p-4 rounded-lg row-span-2">=</button>

            <!-- Linha 5 -->
            <button onclick="calculatePercentage()" class="btn text-2xl font-bold text-white bg-gray-700 hover:bg-gray-800 p-4 rounded-lg">%</button>
            <button onclick="appendToDisplay('0')" class="btn text-2xl font-bold text-white bg-gray-700 hover:bg-gray-800 p-4 rounded-lg">0</button>
            <button onclick="appendToDisplay('.')" class="btn text-2xl font-bold text-white bg-gray-700 hover:bg-gray-800 p-4 rounded-lg">.</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        // Função para adicionar caracteres ao visor
        function appendToDisplay(input) {
            // Se houver um erro no visor, limpe antes de adicionar um novo valor
            if (display.value === 'Erro') {
                display.value = '';
            }
            display.value += input;
        }

        // Função para limpar o visor
        function clearDisplay() {
            display.value = '';
        }

        // Função para apagar o último caractere
        function deleteLast() {
            if (display.value === 'Erro') {
                clearDisplay();
            } else {
                display.value = display.value.toString().slice(0, -1);
            }
        }

        // Função para calcular o resultado da expressão
        function calculateResult() {
            try {
                // Substitui '×' e '÷' por '*' e '/' para a função eval
                let expression = display.value.replace(/×/g, '*').replace(/÷/g, '/');
                // A função eval() calcula a expressão matemática.
                // É poderosa, mas deve ser usada com cuidado com entradas não controladas.
                // Para uma calculadora, é uma solução simples e eficaz.
                const result = eval(expression);
                // Evita resultados como 'Infinity' ou 'NaN' (Not a Number)
                if (!isFinite(result)) {
                    display.value = 'Erro';
                } else {
                    display.value = result;
                }
            } catch (error) {
                // Se a expressão for inválida (ex: "5++2"), exibe "Erro"
                display.value = 'Erro';
            }
        }
        
        // Função para calcular a porcentagem
        function calculatePercentage() {
            if (display.value && display.value !== 'Erro') {
                try {
                    // Pega o valor atual e divide por 100
                    display.value = parseFloat(display.value) / 100;
                } catch (error) {
                    display.value = 'Erro';
                }
            }
        }
        
        // Adiciona suporte para teclado
        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if (key >= '0' && key <= '9') {
                appendToDisplay(key);
            } else if (key === '.') {
                appendToDisplay('.');
            } else if (key === '+') {
                appendToDisplay('+');
            } else if (key === '-') {
                appendToDisplay('-');
            } else if (key === '*') {
                appendToDisplay('*');
            } else if (key === '/') {
                appendToDisplay('/');
            } else if (key === '%') {
                calculatePercentage();
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault(); // Evita o comportamento padrão do Enter
                calculateResult();
            } else if (key === 'Backspace') {
                deleteLast();
            } else if (key === 'Escape' || key.toLowerCase() === 'c') {
                clearDisplay();
            }
        });

    </script>
</body>
</html>
