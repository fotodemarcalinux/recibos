<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Áudio MP3/Opus</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
        input[type="file"], button {
            margin: 10px 0;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: #fff;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status-message {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
        #download-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #28a745;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            transition: background-color 0.3s;
            display: none;
        }
        #download-link:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Conversor de Áudio</h1>
    <p>Converta MP3 para Opus ou Opus para MP3.</p>
    
    <input type="file" id="audio-input" accept=".mp3,.opus">
    
    <button onclick="convertAudio()">Converter e Baixar</button>
    
    <div id="status-message"></div>
    <a id="download-link" href="#" download>Baixar Áudio</a>
</div>

<script src="ffmpeg.min.js"></script>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ log: true });
    
    const audioInput = document.getElementById('audio-input');
    const statusMessage = document.getElementById('status-message');
    const downloadLink = document.getElementById('download-link');
    
    let isFFmpegLoaded = false;
    
    async function loadFFmpeg() {
        if (!isFFmpegLoaded) {
            statusMessage.textContent = 'Carregando o conversor...';
            try {
                await ffmpeg.load();
                isFFmpegLoaded = true;
                statusMessage.textContent = 'Conversor pronto!';
            } catch (error) {
                statusMessage.textContent = 'Erro ao carregar o conversor. Tente novamente.';
                console.error(error);
            }
        }
    }

    async function convertAudio() {
        if (!isFFmpegLoaded) {
            statusMessage.textContent = 'Aguarde, o conversor ainda está carregando...';
            await loadFFmpeg();
            if (!isFFmpegLoaded) return;
        }

        const file = audioInput.files[0];
        if (!file) {
            statusMessage.textContent = 'Por favor, selecione um arquivo de áudio.';
            return;
        }
        
        const inputFileExtension = file.name.split('.').pop().toLowerCase();
        
        let outputFormat, outputCodec, outputMimeType;

        if (inputFileExtension === 'mp3') {
            outputFormat = 'opus';
            outputCodec = 'libopus';
            outputMimeType = 'audio/opus';
        } else if (inputFileExtension === 'opus') {
            outputFormat = 'mp3';
            outputCodec = 'libmp3lame';
            outputMimeType = 'audio/mpeg';
        } else {
            statusMessage.textContent = 'Formato de arquivo não suportado. Por favor, selecione um arquivo .mp3 ou .opus.';
            return;
        }

        const inputFilename = 'input.' + inputFileExtension;
        const outputFilename = `audio_convertido.${outputFormat}`;
        
        statusMessage.textContent = `Convertendo para ${outputFormat.toUpperCase()}...`;
        downloadLink.style.display = 'none';

        try {
            ffmpeg.FS('writeFile', inputFilename, await fetchFile(file));
            
            await ffmpeg.run('-i', inputFilename, '-c:a', outputCodec, outputFilename);
            
            const data = ffmpeg.FS('readFile', outputFilename);
            const blob = new Blob([data.buffer], { type: outputMimeType });
            
            const url = URL.createObjectURL(blob);
            
            downloadLink.href = url;
            downloadLink.download = outputFilename;
            downloadLink.style.display = 'inline-block';
            statusMessage.textContent = 'Conversão concluída!';
            
        } catch (error) {
            statusMessage.textContent = 'Ocorreu um erro durante a conversão. Verifique se o formato do arquivo é compatível.';
            console.error(error);
        }
    }
    
    loadFFmpeg();
</script>

</body>
</html>
