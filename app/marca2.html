<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Marca D'água Simplificado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .preview-container {
            position: relative;
            background-color: #111827; /* Fundo escuro */
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="container mx-auto p-4 sm:p-6 max-w-5xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900">🖼️ Gerador de Marca D'água</h1>
            <p class="text-lg text-gray-600 mt-2">Crie sua marca d'água de forma rápida e fácil.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Coluna de Controles Simplificada -->
            <div class="lg:col-span-1 bg-white rounded-xl shadow-lg p-6 flex flex-col">
                <h2 class="text-2xl font-semibold mb-6 text-gray-800 border-b pb-3">Controles</h2>
                <div class="space-y-6">
                    <!-- Controle de Texto -->
                    <div>
                        <label for="textInput" class="block text-sm font-medium text-gray-700 mb-2">Texto da Marca D'água</label>
                        <input type="text" id="textInput" placeholder="Digite seu texto"
                               class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                               value="Sua Marca">
                    </div>
                </div>
                 <div class="mt-auto pt-6 flex flex-col space-y-3">
                    <button id="downloadBtn"
                            class="w-full bg-green-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-all duration-300 ease-in-out">
                        Download (PNG Transparente)
                    </button>
                </div>
            </div>

            <!-- Coluna de Visualização -->
            <div class="lg:col-span-2 bg-white rounded-xl shadow-lg p-6">
                 <h2 class="text-2xl font-semibold mb-4 text-gray-800">Visualização</h2>
                <div class="preview-container">
                    <canvas id="previewCanvas" width="800" height="800"></canvas>
                </div>
            </div>
        </div>

        <footer class="text-center mt-10 text-sm text-gray-500">
            <p>&copy; 2024 Gerador de Marca D'água. Uma ferramenta versátil para suas imagens.</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Elementos da UI
            const canvas = document.getElementById('previewCanvas');
            const ctx = canvas.getContext('2d');
            const downloadBtn = document.getElementById('downloadBtn');
            const textInput = document.getElementById('textInput');
            
            // Carrega a imagem de exemplo com fundo preto
            const backgroundImage = new Image();
            backgroundImage.src = 'https://placehold.co/800x800/000000/ffffff?text=Sua+Foto+Aqui';
            backgroundImage.onload = () => generateWatermarkPreview();
            backgroundImage.onerror = () => {
                console.error("Falha ao carregar a imagem de exemplo.");
                generateWatermarkPreview();
            }

            // --- CONFIGURAÇÕES FIXAS ---
            const settings = {
                text: textInput.value,
                fontSize: 32,
                angle: -45,
                opacity: 0.6, // 60%
                color: '#FFFFFF',
                font: 'Inter, sans-serif',
                gap: 250,
            };
            
            // --- EVENT LISTENERS ---
            textInput.addEventListener('input', () => {
                settings.text = textInput.value;
                generateWatermarkPreview();
            });
            downloadBtn.addEventListener('click', downloadWatermark);

            /**
             * Gera a visualização da marca d'água no canvas principal.
             */
            function generateWatermarkPreview() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (backgroundImage.complete && backgroundImage.naturalWidth !== 0) {
                    ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
                } else {
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = 'bold 50px Inter';
                    ctx.fillText('Sua Foto Aqui', canvas.width / 2, canvas.height / 2);
                }
                createWatermarkPattern(ctx, canvas.width, canvas.height, settings);
            }

            /**
             * Cria o padrão de marca d'água com texto e linhas cruzadas.
             */
            function createWatermarkPattern(context, width, height, config) {
                // Configurações de estilo
                context.font = `bold ${config.fontSize}px ${config.font}`;
                context.fillStyle = config.color;
                context.strokeStyle = config.color;
                context.lineWidth = 1;
                context.textAlign = 'center';
                context.textBaseline = 'middle';

                // Define a opacidade para todos os elementos da marca d'água
                context.globalAlpha = config.opacity;

                // --- DESENHA TEXTO E PRIMEIRA SÉRIE DE LINHAS ---
                context.save();
                context.translate(width / 2, height / 2);
                context.rotate(config.angle * Math.PI / 180);
                context.translate(-width / 2, -height / 2);
                
                const textWidth = context.measureText(config.text).width;
                const textSpacing = textWidth * 1.8;

                for (let y = -height; y < height * 2; y += config.gap) {
                    // Desenha o texto repetidamente
                    for (let x = -width; x < width * 2; x += textSpacing) {
                        context.fillText(config.text, x, y);
                    }
                    // Desenha uma linha contínua acima do texto
                    context.beginPath();
                    context.moveTo(-width * 2, y - (config.fontSize * 1.2));
                    context.lineTo(width * 2, y - (config.fontSize * 1.2));
                    context.stroke();
                }
                context.restore();

                // --- DESENHA LINHAS TRANSVERSAIS (INVERTIDAS) ---
                context.save();
                context.translate(width / 2, height / 2);
                context.rotate(-config.angle * Math.PI / 180);
                context.translate(-width / 2, -height / 2);

                for (let y = -height; y < height * 2; y += config.gap) {
                    context.beginPath();
                    context.moveTo(-width * 2, y - (config.fontSize * 1.2));
                    context.lineTo(width * 2, y - (config.fontSize * 1.2));
                    context.stroke();
                }
                context.restore();

                // Reseta a opacidade global
                context.globalAlpha = 1.0;
            }

            /**
             * Cria um canvas para download com fundo transparente.
             */
            function downloadWatermark() {
                const downloadCanvas = document.createElement('canvas');
                downloadCanvas.width = 1200;
                downloadCanvas.height = 1200;
                const downloadCtx = downloadCanvas.getContext('2d');
                
                downloadCtx.clearRect(0, 0, downloadCanvas.width, downloadCanvas.height);
                createWatermarkPattern(downloadCtx, downloadCanvas.width, downloadCanvas.height, settings);
                
                const link = document.createElement('a');
                link.download = 'marca-dagua-personalizada.png';
                link.href = downloadCanvas.toDataURL('image/png');
                link.click();
            }
            
            // Gera a primeira visualização ao carregar a página
            generateWatermarkPreview();
        });
    </script>
</body>
</html>
