<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Online</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #f0f8ff;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        .game-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        
        .drawn-numbers {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .drawn-numbers h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        
        .numbers-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        
        .number {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ecf0f1;
            border-radius: 50%;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s;
        }
        
        .drawn {
            background-color: #e74c3c;
            color: white;
            transform: scale(1.1);
        }
        
        .current-number {
            background-color: #2ecc71;
            color: white;
            transform: scale(1.2);
        }
        
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        
        .card {
            background-color: #fff;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        
        .card h3 {
            text-align: center;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        
        .card-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }
        
        .card-cell {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ecf0f1;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .marked {
            background-color: #3498db;
            color: white;
        }
        
        .free {
            background-color: #9b59b6;
            color: white;
        }
        
        .bingo-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(46, 204, 113, 0.9);
            color: white;
            padding: 30px 50px;
            border-radius: 10px;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            display: none;
            z-index: 100;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }
        
        @media (max-width: 768px) {
            .number {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            
            .card {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bingo Online</h1>
        
        <div class="game-controls">
            <button id="start-btn">Iniciar Jogo</button>
            <button id="next-btn" disabled>Sortear Número</button>
            <button id="bingo-btn" disabled>Bingo!</button>
            <button id="reset-btn">Reiniciar</button>
        </div>
        
        <div class="drawn-numbers">
            <h2>Números Sorteados</h2>
            <div id="numbers-grid" class="numbers-grid"></div>
        </div>
        
        <div class="cards-container" id="cards-container">
            <!-- Cartelas serão adicionadas aqui -->
        </div>
        
        <div id="bingo-message" class="bingo-message">BINGO!</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Elementos do DOM
            const startBtn = document.getElementById('start-btn');
            const nextBtn = document.getElementById('next-btn');
            const bingoBtn = document.getElementById('bingo-btn');
            const resetBtn = document.getElementById('reset-btn');
            const numbersGrid = document.getElementById('numbers-grid');
            const cardsContainer = document.getElementById('cards-container');
            const bingoMessage = document.getElementById('bingo-message');
            
            // Variáveis do jogo
            let drawnNumbers = [];
            let availableNumbers = [];
            let gameStarted = false;
            let cards = [];
            
            // Inicializar os números de 1 a 90
            function initializeNumbers() {
                numbersGrid.innerHTML = '';
                for (let i = 1; i <= 90; i++) {
                    const numberElement = document.createElement('div');
                    numberElement.className = 'number';
                    numberElement.textContent = i;
                    numberElement.id = `number-${i}`;
                    numbersGrid.appendChild(numberElement);
                }
            }
            
            // Gerar uma cartela de bingo
            function generateCard() {
                const card = [];
                const numbers = Array.from({length: 90}, (_, i) => i + 1);
                
                // Embaralhar os números
                for (let i = numbers.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
                }
                
                // Selecionar 15 números para a cartela
                for (let i = 0; i < 15; i++) {
                    card.push(numbers[i]);
                }
                
                return card;
            }
            
            // Criar elemento de cartela no DOM
            function createCardElement(card, index) {
                const cardElement = document.createElement('div');
                cardElement.className = 'card';
                cardElement.innerHTML = `<h3>Cartela ${index + 1}</h3>`;
                
                const grid = document.createElement('div');
                grid.className = 'card-grid';
                
                // Ordenar os números para exibição
                const sortedCard = [...card].sort((a, b) => a - b);
                
                sortedCard.forEach(number => {
                    const cell = document.createElement('div');
                    cell.className = 'card-cell';
                    cell.textContent = number;
                    cell.id = `card-${index}-number-${number}`;
                    grid.appendChild(cell);
                });
                
                cardElement.appendChild(grid);
                cardsContainer.appendChild(cardElement);
            }
            
            // Iniciar o jogo
            function startGame() {
                if (gameStarted) return;
                
                gameStarted = true;
                drawnNumbers = [];
                availableNumbers = Array.from({length: 90}, (_, i) => i + 1);
                cards = [];
                cardsContainer.innerHTML = '';
                
                // Criar 4 cartelas
                for (let i = 0; i < 4; i++) {
                    const card = generateCard();
                    cards.push(card);
                    createCardElement(card, i);
                }
                
                startBtn.disabled = true;
                nextBtn.disabled = false;
                bingoBtn.disabled = false;
            }
            
            // Sortear próximo número
            function drawNextNumber() {
                if (availableNumbers.length === 0) {
                    alert('Todos os números já foram sorteados!');
                    return;
                }
                
                // Remover o número atual destacado
                const currentHighlighted = document.querySelector('.current-number');
                if (currentHighlighted) {
                    currentHighlighted.classList.remove('current-number');
                    currentHighlighted.classList.add('drawn');
                }
                
                // Sortear um novo número
                const randomIndex = Math.floor(Math.random() * availableNumbers.length);
                const drawnNumber = availableNumbers[randomIndex];
                
                // Remover o número sorteado da lista de disponíveis
                availableNumbers.splice(randomIndex, 1);
                drawnNumbers.push(drawnNumber);
                
                // Atualizar a exibição do número
                const numberElement = document.getElementById(`number-${drawnNumber}`);
                numberElement.classList.add('current-number');
                
                // Marcar o número nas cartelas
                cards.forEach((card, cardIndex) => {
                    if (card.includes(drawnNumber)) {
                        const cell = document.getElementById(`card-${cardIndex}-number-${drawnNumber}`);
                        cell.classList.add('marked');
                    }
                });
                
                // Verificar se alguém fez bingo
                checkBingo();
            }
            
            // Verificar se alguma cartela fez bingo
            function checkBingo() {
                let bingo = false;
                
                cards.forEach((card, cardIndex) => {
                    const markedNumbers = card.filter(number => drawnNumbers.includes(number));
                    if (markedNumbers.length === card.length) {
                        bingo = true;
                        showBingoMessage(`Cartela ${cardIndex + 1} fez BINGO!`);
                    }
                });
                
                return bingo;
            }
            
            // Exibir mensagem de Bingo
            function showBingoMessage(message) {
                bingoMessage.textContent = message;
                bingoMessage.style.display = 'block';
                
                // Desabilitar botões
                nextBtn.disabled = true;
                bingoBtn.disabled = true;
                
                // Ocultar a mensagem após 5 segundos
                setTimeout(() => {
                    bingoMessage.style.display = 'none';
                }, 5000);
            }
            
            // Reiniciar o jogo
            function resetGame() {
                gameStarted = false;
                drawnNumbers = [];
                availableNumbers = [];
                cards = [];
                
                initializeNumbers();
                cardsContainer.innerHTML = '';
                
                startBtn.disabled = false;
                nextBtn.disabled = true;
                bingoBtn.disabled = true;
            }
            
            // Event listeners
            startBtn.addEventListener('click', startGame);
            nextBtn.addEventListener('click', drawNextNumber);
            resetBtn.addEventListener('click', resetGame);
            bingoBtn.addEventListener('click', () => {
                if (checkBingo()) {
                    showBingoMessage("Bingo Verificado! Parabéns!");
                } else {
                    alert("Ainda não há bingo! Continue jogando.");
                }
            });
            
            // Inicializar o jogo
            initializeNumbers();
        });
    </script>
</body>
</html>
