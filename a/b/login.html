<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script src="./a/b/js/auth.js"></script>
</head>
<body>
  <h2>Login do Cliente</h2>
  <form onsubmit="event.preventDefault(); login(usuario.value, senha.value);">
    <label>Usuário:</label>
    <input type="text" id="usuario" required><br><br>
    <label>Senha:</label>
    <input type="password" id="senha" required><br><br>
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
