<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Cliente - JN2M3A DIGITAL</title>
  <script src="../../js/auth.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary-color: #10b981;
      --dark-color: #1f2937;
      --light-color: #f9fafb;
      --gray-color: #9ca3af;
      --error-color: #ef4444;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
      color: var(--dark-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .logo-container {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .logo {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary-color);
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    
    .logo-subtitle {
      color: var(--gray-color);
      font-size: 1rem;
      font-weight: 400;
    }
    
    .login-container {
      background: white;
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 30px;
      margin-bottom: 30px;
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 25px;
    }
    
    .login-title {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--dark-color);
      margin-bottom: 8px;
    }
    
    .login-subtitle {
      color: var(--gray-color);
      font-size: 0.95rem;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--dark-color);
    }
    
    .input-with-icon {
      position: relative;
    }
    
    .input-with-icon i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-color);
    }
    
    .input-with-icon input {
      padding-left: 45px;
    }
    
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s;
    }
    
    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--primary-color);
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    
    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--gray-color);
      cursor: pointer;
    }
    
    button[type="submit"] {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    button[type="submit"]:hover {
      background-color: var(--primary-dark);
    }
    
    .divider {
      display: flex;
      align-items: center;
      margin: 25px 0;
    }
    
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #e5e7eb;
    }
    
    .divider span {
      padding: 0 15px;
      color: var(--gray-color);
      font-size: 0.9rem;
    }
    
    .support {
      text-align: center;
      margin-top: 20px;
    }
    
    .support p {
      color: var(--gray-color);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    
    .support a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
    }
    
    .support a:hover {
      text-decoration: underline;
    }
    
    footer {
      background-color: var(--dark-color);
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 0.8rem;
      width: 100%;
      margin-top: auto;
    }
    
    footer a {
      color: #fbbf24;
      text-decoration: none;
    }
    
    footer a:hover {
      text-decoration: underline;
    }
    
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: var(--error-color);
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      display: none;
      z-index: 1000;
    }
    
    @media (max-width: 480px) {
      .login-container {
        padding: 20px;
      }
      
      .logo {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo">JN2M3A DIGITAL</div>
    <div class="logo-subtitle">Soluções inteligentes para o seu negócio</div>
  </div>
  
  <div class="login-container">
    <div class="login-header">
      <h1 class="login-title">Área do Cliente</h1>
      <p class="login-subtitle">Acesse seus serviços desenvolvidos pela nossa equipe</p>
    </div>
    
    <form onsubmit="event.preventDefault(); login(usuario.value, senha.value);">
      <div class="form-group">
        <label for="usuario">Usuário</label>
        <div class="input-with-icon">
          <i class="fas fa-user"></i>
          <input type="text" id="usuario" placeholder="Digite seu usuário" required>
        </div>
      </div>
      
      <div class="form-group">
        <label for="senha">Senha</label>
        <div class="input-with-icon">
          <i class="fas fa-lock"></i>
          <input type="password" id="senha" placeholder="Digite sua senha" required>
          <button type="button" class="password-toggle" id="togglePassword">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      
      <button type="submit">Entrar</button>
    </form>
    
    <div class="divider">
      <span>Precisa de ajuda?</span>
    </div>
    
    <div class="support">
      <p>Entre em contato com nosso suporte</p>
      <a href="mailto:suporte@jn2m3adigital.com">suporte@jn2m3adigital.com</a>
    </div>
  </div>
  
  <footer>
    <p>© 2025 
      <a href="https://digital.sou.net.br/" target="_blank">JN2M3A DIGITAL</a>. 
      Uma solução inteligente para o seu negócio.
    </p>
  </footer>
  
  <div class="notification" id="notification">
    <i class="fas fa-exclamation-circle"></i>
    <span id="notification-text"></span>
  </div>

  <script>
    // Função para mostrar/ocultar senha
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('senha');
      const icon = this.querySelector('i');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });
    
    // Sobrescrever a função de alerta padrão para mostrar notificações estilizadas
    const originalAlert = window.alert;
    window.alert = function(message) {
      const notification = document.getElementById('notification');
      const notificationText = document.getElementById('notification-text');
      
      notificationText.textContent = message;
      notification.style.display = 'flex';
      
      setTimeout(() => {
        notification.style.display = 'none';
      }, 5000);
    };
  </script>
</body>
</html>
