<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste1</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .card { transition: all .25s ease; }
        .card:hover { transform: translateY(-6px); box-shadow: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1); }
        a:focus, button:focus { outline: 2px solid #3b82f6; outline-offset: 2px; }
        .placeholder { background-color: #e5e7eb; border-radius: 0.5rem; min-height: 10rem; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
    
    <!-- Inclui o script de autenticação para execução imediata -->
    <script src="../js/auth.js"></script>
    <script>
        // Executa a verificação de login imediatamente para proteger a página antes de renderizar o conteúdo
        if (typeof verificarLogin === 'function') {
            verificarLogin();
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="bg-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center">
                <img src="https://digital.sou.net.br/backend/logo.webp" alt="logo" class="h-12 w-auto">
                <span class="ml-3 text-2xl font-bold text-gray-800">teste1</span>
            </div>
            <div class="flex items-center gap-4">
                <a href="#" onclick="if(typeof logout === 'function') { event.preventDefault(); logout(); } else { alert('Função de logout não encontrada.'); }" class="bg-red-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-red-600 transition-colors">Sair</a>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 py-12 flex-grow">

        <!-- Seção de Cards - Conteúdo será carregado aqui -->
        <section id="cards-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            <div class="placeholder h-36"></div><div class="placeholder h-36"></div><div class="placeholder h-36"></div><div class="placeholder h-36"></div>
        </section>
        
        <!-- Seção de Links - Conteúdo será carregado aqui -->
        <section id="links-container" class="mt-16"></section>
        
        <!-- Seção de Informações - Conteúdo será carregado aqui -->
        <section id="info-container" class="mt-16"></section>

        <!-- Seção de Promoções - Conteúdo será carregado aqui -->
        <section id="promos-container" class="mt-16"></section>

    </main>

    <footer class="bg-gray-800 text-white py-6 text-center text-sm mt-16">
        <div class="container mx-auto px-6">
            <p>©2025 <a href="https://digital.sou.net.br/" target="_blank">JN2M3A DIGITAL</a>. Todos os direitos reservados.</p>
            <p class="mt-2"><a href="https://wa.me/5579998965081" class="text-amber-400 hover:underline">WhatsApp: (79) 99896-5081</a></p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            const paths = {
                cards: 'data/cards.json',
                links: 'data/links.json',
                info: 'data/info.json',
                promos: 'data/promos.json'
            };

            const fetchData = async (url, containerId, renderer) => {
                if (!url) {
                    const container = document.getElementById(containerId);
                    if(container) container.style.display = 'none';
                    return;
                }
                try {
                    const response = await fetch(url + '?v=' + new Date().getTime()); // Cache busting
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();
                    renderer(data);
                } catch (error) {
                    console.error(`Erro ao carregar dados de ${url}:`, error);
                    const container = document.getElementById(containerId);
                    if(container) container.innerHTML = `<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert"><strong class="font-bold">Erro:</strong><span class="block sm:inline"> Não foi possível carregar esta seção.</span></div>`;
                }
            };

            // --- Renderizadores para cada seção ---

            const renderCards = (data) => {
                const container = document.getElementById('cards-container');
                if (!data || data.length === 0) { container.style.display = 'none'; return; }
                container.innerHTML = data.map(card => `
                    <a href="${card.link || '#'}" class="block p-6 bg-white rounded-xl shadow-lg card overflow-hidden" style="border-top: 5px solid ${card.color || '#3b82f6'};">
                        <h2 class="text-xl font-bold text-gray-800">${card.title || ''}</h2>
                        <p class="mt-2 text-gray-600">${card.desc || ''}</p>
                    </a>
                `).join('');
            };

            const renderLinks = (data) => {
                const container = document.getElementById('links-container');
                if (!data || data.length === 0) { container.style.display = 'none'; return; }
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-lg shadow-lg">
                        <h3 class="font-bold text-xl mb-4 text-gray-800">Links Rápidos</h3>
                        <div class="grid gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
                            ${data.map(link => `<a href="${link.link || '#'}" class="py-3 px-4 bg-gray-50 border border-gray-200 rounded-lg text-center font-semibold text-gray-700 hover:bg-gray-100 hover:border-gray-300 transition-colors">${link.title || 'Link'}</a>`).join('')}
                        </div>
                    </div>`;
            };
            
            const renderInfo = (data) => {
                const container = document.getElementById('info-container');
                if (!data || data.length === 0) { container.style.display = 'none'; return; }
                container.innerHTML = `
                <div class="bg-white p-6 sm:p-8 rounded-lg shadow-lg">
                    <h2 class="font-bold text-2xl mb-6 text-gray-800 border-b pb-4">Informações Importantes</h2>
                    <div class="space-y-8">
                        ${data.map(info => `
                            <div class="flex flex-col ${info.imageBase64 ? 'md:flex-row md:items-center gap-8' : ''}">
                                ${info.imageBase64 ? `<div class="md:w-1/3 flex-shrink-0"><img src="${info.imageBase64}" alt="${info.title || ''}" class="rounded-lg w-full h-auto object-cover"></div>` : ''}
                                <div class="${info.imageBase64 ? 'md:w-2/3' : 'w-full'}">
                                    <h3 class="font-bold text-xl mb-2 text-gray-800">${info.title || ''}</h3>
                                    <p class="text-gray-600 leading-relaxed">${info.text || ''}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            };

            const renderPromos = (data) => {
                const container = document.getElementById('promos-container');
                if (!data || data.length === 0) { container.style.display = 'none'; return; }
                container.innerHTML = `
                <div class="grid md:grid-cols-2 gap-8">
                    ${data.map(promo => `
                    <div class="bg-white rounded-lg shadow-lg overflow-hidden flex flex-col">
                        ${promo.imageBase64 ? `<img src="${promo.imageBase64}" alt="${promo.title || ''}" class="w-full h-48 object-cover">` : ''}
                        <div class="p-6 flex flex-col flex-grow">
                            <h4 class="font-bold text-xl mb-2 text-gray-800">${promo.title || 'Promoção'}</h4>
                            <p class="text-gray-600 mb-4 flex-grow">${promo.text || ''}</p>
                            <a href="${promo.link || '#'}" class="inline-block font-semibold text-blue-600 hover:underline mt-auto self-start">Ver promoção &rarr;</a>
                        </div>
                    </div>
                    `).join('')}
                </div>`;
            };
            
            // Iniciar o carregamento dos dados
            fetchData(paths.cards, 'cards-container', renderCards);
            fetchData(paths.links, 'links-container', renderLinks);
            fetchData(paths.info, 'info-container', renderInfo);
            fetchData(paths.promos, 'promos-container', renderPromos);
        });
    </script>
    
    <!-- O script de autenticação foi movido para o <head> para execução prioritária -->
</body>
</html>
