<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Redação ENEM - Nota 1000</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .essay-paper { 
            background: linear-gradient(to right, #f8f9fa 0%, #ffffff 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .typing-animation {
            border-right: 2px solid #667eea;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50% { border-color: #667eea; }
            51%, 100% { border-color: transparent; }
        }
        .line-paper {
            background-image: repeating-linear-gradient(
                transparent,
                transparent 24px,
                #e5e7eb 24px,
                #e5e7eb 26px
            );
            line-height: 26px;
            padding-top: 13px;
        }
    </style>
</head>
<body class="min-h-screen gradient-bg">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">🎓 Gerador de Redação ENEM</h1>
            <p class="text-xl text-white/90">Nota 1000 - Formato 30 Linhas</p>
        </div>

        <!-- Input Section -->
        <div class="max-w-4xl mx-auto mb-8">
            <div class="bg-white rounded-2xl p-6 shadow-xl">
                <label for="tema" class="block text-lg font-semibold text-gray-700 mb-3">
                    📝 Digite o tema da redação:
                </label>
                <div class="flex gap-3">
                    <input 
                        type="text" 
                        id="tema" 
                        placeholder="Ex: A importância da educação digital no Brasil"
                        class="flex-1 px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:outline-none text-lg"
                    >
                    <button 
                        onclick="gerarRedacao()" 
                        class="bg-gradient-to-r from-purple-600 to-blue-600 text-white px-8 py-3 rounded-xl font-semibold hover:from-purple-700 hover:to-blue-700 transition-all duration-300 shadow-lg hover:shadow-xl"
                    >
                        ✨ Gerar Redação
                    </button>
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="hidden text-center mb-8">
            <div class="bg-white rounded-2xl p-6 shadow-xl max-w-md mx-auto">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-600 mx-auto mb-3"></div>
                <p class="text-gray-600">Gerando sua redação nota 1000...</p>
            </div>
        </div>

        <!-- Essay Output -->
        <div id="redacaoContainer" class="hidden max-w-4xl mx-auto">
            <div class="essay-paper rounded-2xl p-8 mb-6">
                <!-- Header da redação -->
                <div class="border-b-2 border-gray-200 pb-4 mb-6">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <p class="text-sm text-gray-600">Nome: ________________________________</p>
                            <p class="text-sm text-gray-600 mt-1">Número: _______ Turma: _______</p>
                        </div>
                        <div class="text-right">
                            <div class="bg-green-100 border-2 border-green-500 rounded-lg px-3 py-1">
                                <span class="text-green-700 font-bold text-lg">NOTA: 1000</span>
                            </div>
                        </div>
                    </div>
                    <h2 id="temaRedacao" class="text-xl font-bold text-center text-gray-800 mt-4"></h2>
                </div>

                <!-- Conteúdo da redação -->
                <div id="conteudoRedacao" class="line-paper min-h-96 text-gray-800 leading-relaxed"></div>
            </div>

            <!-- Botões de ação -->
            <div class="flex gap-4 justify-center">
                <button 
                    onclick="copiarRedacao()" 
                    class="bg-green-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-green-700 transition-all duration-300 shadow-lg"
                >
                    📋 Copiar Redação
                </button>
                <button 
                    onclick="novaRedacao()" 
                    class="bg-blue-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-blue-700 transition-all duration-300 shadow-lg"
                >
                    🔄 Nova Redação
                </button>
            </div>
        </div>
    </div>

    <script>
        function gerarRedacao() {
            const tema = document.getElementById('tema').value.trim();
            
            if (!tema) {
                alert('Por favor, digite um tema para a redação!');
                return;
            }

            // Mostrar loading
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('redacaoContainer').classList.add('hidden');

            // Simular tempo de geração
            setTimeout(() => {
                criarRedacao(tema);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('redacaoContainer').classList.remove('hidden');
                
                // Scroll suave para a redação
                document.getElementById('redacaoContainer').scrollIntoView({ 
                    behavior: 'smooth' 
                });
            }, 2000);
        }

        function criarRedacao(tema) {
            document.getElementById('temaRedacao').textContent = tema;
            
            const introducao = gerarIntroducao(tema);
            const desenvolvimento = gerarDesenvolvimento(tema);
            const conclusao = gerarConclusao(tema);

            const redacaoCompleta = `
                <p class="mb-8 text-justify indent-8">${introducao}</p>
                <p class="mb-8 text-justify indent-8">${desenvolvimento}</p>
                <p class="mb-8 text-justify indent-8">${conclusao}</p>
            `;

            // Efeito de digitação
            typeWriter(redacaoCompleta, 'conteudoRedacao', 30);
        }

        function gerarIntroducao(tema) {
            const introducoes = [
                `A sociedade brasileira contemporânea enfrenta desafios significativos relacionados a ${tema.toLowerCase()}, questão que se tornou central no debate público nacional. Nesse contexto, torna-se fundamental analisar as múltiplas dimensões dessa problemática, considerando tanto os aspectos históricos quanto as demandas atuais da população. A complexidade do tema exige uma abordagem multidisciplinar que contemple fatores sociais, econômicos e políticos. Dessa forma, é necessário compreender as causas estruturais do problema e buscar soluções efetivas que promovam transformações sociais duradouras. Portanto, a discussão sobre ${tema.toLowerCase()} revela-se imprescindível para a construção de uma sociedade mais justa e próspera.`,
                
                `O Brasil, país de dimensões continentais e rica diversidade cultural, apresenta complexidades particulares no que se refere a ${tema.toLowerCase()}, tema que tem ganhado crescente relevância no cenário nacional. Essa realidade exige uma reflexão aprofundada sobre os fatores que contribuem para a perpetuação de desigualdades e a necessidade de políticas públicas eficazes. A herança histórica do país, marcada por processos excludentes, criou um cenário propício para o agravamento de problemas sociais estruturais. Ademais, as transformações tecnológicas contemporâneas trouxeram novos desafios que demandam respostas inovadoras. Nesse sentido, torna-se imprescindível examinar as raízes históricas dessa problemática e propor alternativas viáveis para sua superação.`,
                
                `Na conjuntura social brasileira atual, ${tema.toLowerCase()} representa um dos principais desafios a serem enfrentados pela sociedade e pelo poder público, configurando-se como questão prioritária na agenda nacional. Essa problemática, que possui raízes históricas profundas, demanda uma abordagem multidisciplinar e o envolvimento coordenado de diversos setores sociais. A magnitude do desafio exige não apenas o reconhecimento de sua importância, mas também a mobilização de recursos adequados para seu enfrentamento. Paralelamente, as transformações sociais e tecnológicas em curso criaram novas dimensões para problemas antigos, exigindo soluções inovadoras. Assim, faz-se necessário analisar criticamente os fatores que perpetuam essa situação e desenvolver estratégias integradas de enfrentamento.`
            ];
            
            return introducoes[Math.floor(Math.random() * introducoes.length)];
        }

        function gerarDesenvolvimento(tema) {
            const desenvolvimentos = [
                `Em primeiro lugar, é fundamental reconhecer que as raízes históricas do problema estão intrinsecamente ligadas ao processo de formação da sociedade brasileira, marcado por estruturas excludentes que persistem até os dias atuais. A herança colonial, caracterizada pela concentração de poder e recursos, criou um cenário propício para a perpetuação de injustiças sociais e desigualdades estruturais. Nesse sentido, a falta de investimentos adequados em políticas públicas universais contribuiu significativamente para o agravamento da situação, criando um ciclo vicioso de exclusão. Ademais, a ausência de mecanismos efetivos de participação popular limitou as possibilidades de transformação social, evidenciando a necessidade de reformas estruturais. Paralelamente, os fatores socioeconômicos exercem influência determinante na configuração atual do problema, uma vez que a concentração de renda cria barreiras para o desenvolvimento humano pleno. Além disso, a precariedade dos serviços públicos essenciais perpetua ciclos de exclusão social que afetam principalmente as camadas mais vulneráveis da população.`,
                
                `Primordialmente, deve-se considerar que os aspectos culturais e educacionais desempenham papel crucial na manutenção do status quo, influenciando diretamente a perpetuação de práticas que impedem o avanço social. A reprodução de práticas discriminatórias e a naturalização de desigualdades impedem o avanço de uma sociedade mais justa e democrática. Paralelamente, a insuficiência de programas educativos que promovam a conscientização cidadã limita as possibilidades de mudança comportamental e transformação social. Consequentemente, a perpetuação de estereótipos e preconceitos dificulta a construção de um ambiente social mais harmonioso e respeitoso às diferenças. Outrossim, a dimensão institucional do problema revela a necessidade de reformas estruturais no aparato estatal brasileiro, que ainda carrega vícios históricos. A burocracia excessiva e a falta de transparência comprometem a qualidade das políticas públicas implementadas. Concomitantemente, problemas como corrupção e clientelismo político desviam recursos que poderiam ser direcionados para questões sociais prioritárias.`,
                
                `Inicialmente, cabe destacar que os desafios contemporâneos exigem uma abordagem inovadora que considere as transformações tecnológicas e sociais em curso no século XXI. A era digital trouxe novas possibilidades de participação cidadã e acesso à informação, mas também criou novos tipos de exclusão e desigualdade social. Nesse contexto, a capacitação tecnológica da população torna-se fundamental para garantir a inclusão social plena e o exercício efetivo da cidadania. Portanto, é necessário desenvolver políticas públicas inovadoras que aproveitem o potencial das novas tecnologias para promover a democratização do conhecimento e das oportunidades. Sob outra perspectiva, a questão ambiental emerge como fator indissociável da problemática social brasileira, uma vez que a degradação do meio ambiente afeta desproporcionalmente as populações mais vulneráveis. A falta de saneamento básico e a poluição criam um ciclo vicioso de pobreza e exclusão. Simultaneamente, a ausência de políticas ambientais efetivas compromete a sustentabilidade do desenvolvimento nacional e a qualidade de vida das futuras gerações.`
            ];
            
            return desenvolvimentos[Math.floor(Math.random() * desenvolvimentos.length)];
        }

        function gerarConclusao(tema) {
            const conclusoes = [
                `Portanto, fica evidente que a superação dos desafios relacionados a ${tema.toLowerCase()} demanda ações coordenadas e multissetoriais, que envolvam não apenas o poder público, mas toda a sociedade brasileira em um esforço coletivo de transformação. Nesse sentido, propõe-se que o Governo Federal, em parceria com estados e municípios, implemente políticas públicas integradas que abordem as causas estruturais do problema, garantindo recursos adequados e mecanismos de monitoramento. Tal iniciativa deve incluir investimentos em educação de qualidade, fortalecimento das instituições democráticas e criação de canais efetivos de participação cidadã. Ademais, é fundamental que a sociedade civil organize-se em movimentos de conscientização e cobrança por transparência governamental, assumindo seu papel protagonista na construção de uma democracia mais participativa. Concomitantemente, os órgãos de controle devem intensificar a fiscalização da aplicação de recursos públicos, garantindo maior eficiência e transparência na gestão pública. Somente através dessa articulação entre poder público e sociedade será possível construir um Brasil mais justo, igualitário e próspero para as futuras gerações.`,
                
                `Em síntese, a resolução da problemática exige um compromisso coletivo com a transformação social, que transcenda governos e partidos políticos, consolidando-se como política de Estado prioritária. Para tanto, sugere-se que o Congresso Nacional aprove legislação específica que garanta recursos adequados para políticas de inclusão social e desenvolvimento sustentável, estabelecendo metas claras e mecanismos de acompanhamento. Paralelamente, as universidades devem ampliar seus programas de extensão, levando conhecimento e tecnologia às comunidades mais necessitadas, promovendo a democratização do saber. Simultaneamente, os órgãos do sistema de justiça devem atuar de forma mais efetiva na garantia dos direitos fundamentais, combatendo práticas discriminatórias e promovendo a igualdade de oportunidades. Ademais, é essencial que o setor privado assuma sua responsabilidade social, investindo em projetos que contribuam para o desenvolvimento social e ambiental do país. Por fim, é fundamental que cada cidadão assuma sua responsabilidade individual, participando ativamente dos processos democráticos e promovendo mudanças concretas em seu ambiente de convivência.`,
                
                `Diante do exposto, conclui-se que a transformação da realidade brasileira passa necessariamente pelo enfrentamento sistemático das desigualdades estruturais que marcam nossa sociedade, exigindo um pacto nacional pela justiça social e pelo desenvolvimento sustentável. Assim, recomenda-se que as três esferas de governo estabeleçam um plano nacional de longo prazo, com metas específicas e recursos garantidos, que integre políticas sociais, econômicas e ambientais de forma eficiente. Concomitantemente, o Poder Legislativo deve aprovar reformas estruturais que modernizem o Estado brasileiro, tornando-o mais eficiente e transparente. Paralelamente, o sistema educacional precisa passar por uma revolução qualitativa que garanta educação de excelência para todos, promovendo o desenvolvimento do pensamento crítico e da consciência cidadã. Simultaneamente, é imprescindível que o país invista em ciência, tecnologia e inovação, criando as bases para um desenvolvimento sustentável. Ademais, a sociedade civil deve ampliar sua capacidade de mobilização, exercendo o controle social das políticas públicas. Apenas através dessa mobilização coletiva será possível materializar o sonho de um país verdadeiramente livre, justo e próspero para todos os brasileiros.`
            ];
            
            return conclusoes[Math.floor(Math.random() * conclusoes.length)];
        }

        function typeWriter(text, elementId, speed) {
            const element = document.getElementById(elementId);
            element.innerHTML = '';
            element.classList.add('typing-animation');
            
            // Remove tags HTML para digitação caractere por caractere
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = text;
            const plainText = tempDiv.textContent || tempDiv.innerText || '';
            
            let i = 0;
            function type() {
                if (i < plainText.length) {
                    element.innerHTML = plainText.substring(0, i + 1).replace(/\n/g, '<br>');
                    i++;
                    setTimeout(type, speed);
                } else {
                    element.classList.remove('typing-animation');
                    // Aplicar formatação final
                    element.innerHTML = text;
                }
            }
            type();
        }

        function copiarRedacao() {
            const conteudo = document.getElementById('conteudoRedacao').innerText;
            const tema = document.getElementById('temaRedacao').innerText;
            const textoCompleto = `${tema}\n\n${conteudo}`;
            
            navigator.clipboard.writeText(textoCompleto).then(() => {
                alert('✅ Redação copiada para a área de transferência!');
            });
        }

        function novaRedacao() {
            document.getElementById('tema').value = '';
            document.getElementById('redacaoContainer').classList.add('hidden');
            document.getElementById('tema').focus();
        }

        // Enter para gerar redação
        document.getElementById('tema').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                gerarRedacao();
            }
        });
    </script>
