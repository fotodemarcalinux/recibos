<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Redação ENEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .blinking-cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background-color: #3b82f6;
            animation: blink 1s step-end infinite;
            vertical-align: bottom;
        }
        @keyframes blink {
            from, to { background-color: transparent }
            50% { background-color: #3b82f6; }
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-500">

    <div class="container mx-auto px-4 py-8 md:py-12 max-w-4xl">
        
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-blue-600 dark:text-blue-400">Gerador de Redação ENEM</h1>
            <p class="mt-2 text-lg text-gray-600 dark:text-gray-400">Insira o tema e obtenha uma redação modelo adaptável.</p>
        </header>

        <div class="bg-white dark:bg-gray-800 p-6 md:p-8 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700">
            <div class="flex flex-col sm:flex-row gap-4">
                <input type="text" id="temaInput" placeholder="Digite o tema da redação aqui..." class="flex-grow w-full px-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition duration-300">
                <button id="generateButton" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" />
                        <path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd" />
                    </svg>
                    Gerar Redação
                </button>
            </div>
        </div>

        <div id="resultContainer" class="mt-8 bg-white dark:bg-gray-800 p-6 md:p-8 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 min-h-[300px]">
            <div id="placeholder" class="flex flex-col items-center justify-center text-center text-gray-400 dark:text-gray-500 h-full">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <h3 class="text-xl font-semibold">Sua redação aparecerá aqui.</h3>
                <p>Pronto para começar a escrever?</p>
            </div>

            <div id="essayContent" class="prose prose-lg dark:prose-invert max-w-none">
                <!-- O título e os parágrafos serão inseridos aqui -->
            </div>
        </div>

    </div>

    <script>
        const temaInput = document.getElementById('temaInput');
        const generateButton = document.getElementById('generateButton');
        const placeholder = document.getElementById('placeholder');
        const essayContent = document.getElementById('essayContent');

        generateButton.addEventListener('click', generateEssay);
        temaInput.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                generateEssay();
            }
        });

        function generateEssay() {
            const theme = temaInput.value.trim();
            if (!theme) {
                // Em vez de alert, podemos mostrar uma mensagem sutil
                temaInput.placeholder = "Por favor, insira um tema primeiro!";
                temaInput.classList.add('placeholder-red-500');
                return;
            }
            // Reseta o placeholder em caso de sucesso
            temaInput.placeholder = "Digite o tema da redação aqui...";
            temaInput.classList.remove('placeholder-red-500');

            placeholder.classList.add('hidden');
            essayContent.innerHTML = '';
            
            // --- REDAÇÃO MODELO EMBUTIDA NO CÓDIGO ---
            const essayTemplate = `
O desafio de ${theme.toLowerCase()} no Brasil
A Constituição Federal de 1988 assegura a todos os cidadãos direitos básicos para a manutenção do bem-estar social. Contudo, a persistência de problemáticas como ${theme.toLowerCase()} evidencia uma lacuna entre a teoria e a prática. Nesse viés, a questão se perpetua devido não só à negligência estatal, mas também a uma mentalidade social que precisa ser transformada.

Em primeira análise, é notória a inoperância governamental como um dos principais fatores para a manutenção desse cenário adverso. A falta de fiscalização efetiva e de investimentos adequados em áreas cruciais acaba por agravar o problema, criando um ciclo vicioso de desamparo. Essa falha do poder público em cumprir seu papel fundamental fere diretamente os princípios de uma sociedade justa e igualitária.

Ademais, a mentalidade social predominante também contribui para a complexidade do impasse. Muitas vezes, a falta de conscientização coletiva e a normalização de certas práticas impedem o progresso e a implementação de soluções eficazes. É imperativo que a sociedade civil se mobilize e assuma seu papel ativo na cobrança por mudanças e na promoção de uma cultura de maior responsabilidade e empatia.

Portanto, medidas são necessárias para reverter essa situação. Cabe ao Governo Federal, por meio de seus ministérios, criar um plano nacional de ação que vise fortalecer as políticas públicas relacionadas ao tema. Isso deve ser feito com a alocação de mais recursos e a criação de canais de diálogo com a sociedade, a fim de garantir que as medidas sejam eficazes. Tal iniciativa, detalhada e amplamente divulgada pela mídia, tem como finalidade mitigar os impactos de ${theme.toLowerCase()} e construir um país mais justo para todos.
            `;
            
            displayEssay(essayTemplate.trim());
        }

        function displayEssay(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            const title = lines[0];
            const paragraphs = lines.slice(1);

            let html = `<h2 class="text-2xl font-bold text-center mb-6">${title}</h2>`;
            paragraphs.forEach(p => {
                html += `<p class="mb-4 text-justify">${p}</p>`;
            });

            essayContent.innerHTML = '';
            
            let fullTextHtml = html;
            let currentHtml = '';
            let i = 0;

            function typeWriter() {
                if (i < fullTextHtml.length) {
                    if (fullTextHtml.charAt(i) === '<') {
                        let tagEnd = fullTextHtml.indexOf('>', i);
                        currentHtml += fullTextHtml.substring(i, tagEnd + 1);
                        i = tagEnd;
                    } else {
                        currentHtml += fullTextHtml.charAt(i);
                    }
                    essayContent.innerHTML = currentHtml + '<span class="blinking-cursor"></span>';
                    i++;
                    setTimeout(typeWriter, 5); // Aumentei a velocidade da digitação
                } else {
                     essayContent.innerHTML = fullTextHtml;
                }
            }

            typeWriter();
        }
    </script>
</body>
</html>
