<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Redação Nota 1000 ENEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Estilo para a animação do cursor piscando */
        .blinking-cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background-color: #3b82f6;
            animation: blink 1s step-end infinite;
            vertical-align: bottom;
        }
        @keyframes blink {
            from, to { background-color: transparent }
            50% { background-color: #3b82f6; }
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-500">

    <div class="container mx-auto px-4 py-8 md:py-12 max-w-4xl">
        
        <!-- Cabeçalho -->
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-blue-600 dark:text-blue-400">Gerador de Redação ENEM</h1>
            <p class="mt-2 text-lg text-gray-600 dark:text-gray-400">Insira o tema e obtenha uma redação modelo nota 1000.</p>
        </header>

        <!-- Seção de Geração -->
        <div class="bg-white dark:bg-gray-800 p-6 md:p-8 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700">
            <div class="flex flex-col sm:flex-row gap-4">
                <input type="text" id="temaInput" placeholder="Digite o tema da redação aqui..." class="flex-grow w-full px-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition duration-300">
                <button id="generateButton" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" />
                        <path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd" />
                    </svg>
                    Gerar Redação
                </button>
            </div>
        </div>

        <!-- Seção de Resultado -->
        <div id="resultContainer" class="mt-8 bg-white dark:bg-gray-800 p-6 md:p-8 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 min-h-[300px]">
            <!-- Indicador de Carregamento -->
            <div id="loading" class="hidden flex-col items-center justify-center text-center text-gray-500 dark:text-gray-400">
                 <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                <p class="mt-4 text-lg">Gerando sua redação... Isso pode levar alguns segundos.</p>
            </div>
            
            <!-- Placeholder Inicial -->
            <div id="placeholder" class="flex flex-col items-center justify-center text-center text-gray-400 dark:text-gray-500 h-full">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <h3 class="text-xl font-semibold">Sua redação aparecerá aqui.</h3>
                <p>Pronto para começar a escrever?</p>
            </div>

            <!-- Conteúdo da Redação -->
            <div id="essayContent" class="prose prose-lg dark:prose-invert max-w-none">
                <!-- O título e os parágrafos serão inseridos aqui -->
            </div>
        </div>

    </div>

    <script>
        const temaInput = document.getElementById('temaInput');
        const generateButton = document.getElementById('generateButton');
        const resultContainer = document.getElementById('resultContainer');
        const loading = document.getElementById('loading');
        const placeholder = document.getElementById('placeholder');
        const essayContent = document.getElementById('essayContent');

        generateButton.addEventListener('click', generateEssay);
        temaInput.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                generateEssay();
            }
        });

        async function generateEssay() {
            const theme = temaInput.value.trim();
            if (!theme) {
                alert('Por favor, insira um tema para a redação.');
                return;
            }

            // Prepara a UI para a geração
            placeholder.classList.add('hidden');
            essayContent.innerHTML = '';
            loading.classList.remove('hidden');
            loading.classList.add('flex');
            generateButton.disabled = true;
            generateButton.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                // Monta o prompt detalhado para a API
                const prompt = `
                    Você é um especialista em redação do ENEM, treinado para criar textos dissertativo-argumentativos que sigam rigorosamente a estrutura e os critérios de avaliação para a nota 1000.
                    Escreva uma redação completa, com título, sobre o tema: "${theme}".

                    Siga a seguinte estrutura:
                    1.  **Título:** Crie um título criativo e pertinente ao tema.
                    2.  **Introdução (1º parágrafo):** Apresente o tema de forma clara, contextualize-o com um repertório sociocultural (ex: alusão histórica, citação filosófica, referência a uma obra literária/cinematográfica) e exponha uma tese explícita que será defendida ao longo do texto.
                    3.  **Desenvolvimento 1 (2º parágrafo):** Apresente um argumento principal que sustente a tese. Inicie o parágrafo com um conectivo. Desenvolva o argumento com explicações e utilize um repertório sociocultural pertinente (filosofia, sociologia, história, literatura, dados estatísticos, etc.) para embasar a argumentação.
                    4.  **Desenvolvimento 2 (3º parágrafo):** Apresente um segundo argumento, distinto do primeiro, que também reforce a tese. Inicie o parágrafo com um conectivo. Desenvolva este argumento e utilize outro repertório sociocultural relevante para fortalecê-lo.
                    5.  **Conclusão (4º parágrafo):** Inicie com um conectivo conclusivo. Retome a tese inicial. Elabore uma **Proposta de Intervenção Social** completa e detalhada, que seja viável e respeite os direitos humanos. A proposta deve responder claramente às seguintes perguntas:
                        - **Agente:** Quem executará a ação? (ex: Governo Federal, Ministérios, ONGs, Mídia)
                        - **Ação:** O que será feito? (a ação em si)
                        - **Meio/Modo:** Como a ação será realizada? (os passos, os recursos)
                        - **Finalidade:** Para que a ação servirá? (o objetivo esperado)
                        - **Detalhamento:** Detalhe um dos elementos anteriores, explicando-o melhor.

                    **Requisitos:**
                    - O texto deve ter exatamente 4 parágrafos.
                    - Utilize a norma culta da língua portuguesa, com coesão e coerência.
                    - A resposta deve ser apenas o texto da redação, começando com o título em uma linha, seguido pelos parágrafos. Não inclua introduções como "Aqui está a redação:" ou qualquer outra coisa.
                `;

                const generatedText = await callGeminiAPI(prompt);
                
                // Formata e exibe o resultado
                displayEssay(generatedText);

            } catch (error) {
                console.error('Erro ao gerar redação:', error);
                essayContent.innerHTML = `<p class="text-red-500 text-center">Ocorreu um erro ao tentar gerar a redação. Por favor, tente novamente.</p>`;
            } finally {
                // Restaura a UI
                loading.classList.add('hidden');
                loading.classList.remove('flex');
                generateButton.disabled = false;
                generateButton.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        async function callGeminiAPI(prompt, retries = 3, delay = 1000) {
            let chatHistory = [{ role: "user", parts: [{ text: prompt }] }];
            const payload = { contents: chatHistory };
            const apiKey = ""; // A chave será fornecida pelo ambiente
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    
                    if (result.candidates && result.candidates.length > 0 &&
                        result.candidates[0].content && result.candidates[0].content.parts &&
                        result.candidates[0].content.parts.length > 0) {
                        return result.candidates[0].content.parts[0].text;
                    } else {
                        throw new Error('Resposta da API inválida ou sem conteúdo.');
                    }
                } catch (error) {
                    console.warn(`Tentativa ${i + 1} falhou. Tentando novamente em ${delay}ms...`);
                    if (i < retries - 1) {
                        await new Promise(res => setTimeout(res, delay));
                        delay *= 2; // Backoff exponencial
                    } else {
                        throw error;
                    }
                }
            }
        }

        function displayEssay(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            if (lines.length === 0) {
                essayContent.innerHTML = `<p class="text-center">Não foi possível gerar um conteúdo para este tema.</p>`;
                return;
            }
            
            const title = lines[0];
            const paragraphs = lines.slice(1);

            let html = `<h2 class="text-2xl font-bold text-center mb-6">${title}</h2>`;
            paragraphs.forEach(p => {
                html += `<p class="mb-4 text-justify">${p}</p>`;
            });

            essayContent.innerHTML = ''; // Limpa antes de adicionar
            
            // Simula a digitação para um efeito mais dinâmico
            let fullTextHtml = html;
            let currentHtml = '';
            let i = 0;

            function typeWriter() {
                if (i < fullTextHtml.length) {
                    // Pula tags HTML para não digitá-las caractere por caractere
                    if (fullTextHtml.charAt(i) === '<') {
                        let tagEnd = fullTextHtml.indexOf('>', i);
                        currentHtml += fullTextHtml.substring(i, tagEnd + 1);
                        i = tagEnd;
                    } else {
                        currentHtml += fullTextHtml.charAt(i);
                    }
                    essayContent.innerHTML = currentHtml + '<span class="blinking-cursor"></span>';
                    i++;
                    setTimeout(typeWriter, 10);
                } else {
                     essayContent.innerHTML = fullTextHtml; // Garante que o cursor suma no final
                }
            }

            typeWriter();
        }
    </script>
</body>
</html>
