<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de Postagens para Blogger</title>
    <!-- Incluindo Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Incluindo EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        emailjs.init('4RbQgOdqiUQJJhn4o'); // Sua chave pública do EmailJS
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 md:p-12 rounded-2xl shadow-xl w-full max-w-2xl">
        <h1 class="text-3xl md:text-4xl font-bold text-center text-gray-800 mb-6">
            Criador de Postagens para Blogger
        </h1>
        
        <p class="text-center text-gray-600 mb-8">
            Preencha os campos abaixo para enviar o conteúdo diretamente para seu blog.
        </p>

        <!-- Formulário modificado para usar EmailJS -->
        <form id="blog-form" class="space-y-6">
            <div>
                <label for="titulo" class="block text-gray-700 font-medium mb-2">Título da Postagem</label>
                <input 
                    type="text" 
                    id="titulo" 
                    placeholder="Ex: Minha primeira postagem no blog"
                    required 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>
            
            <div>
                <label for="conteudo" class="block text-gray-700 font-medium mb-2">Conteúdo da Postagem</label>
                <textarea 
                    id="conteudo" 
                    rows="10"
                    placeholder="Escreva o conteúdo da sua postagem aqui..."
                    required 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"
                ></textarea>
            </div>

            <button 
                type="button" 
                onclick="sendEmail()" 
                class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg shadow-md hover:bg-blue-700 transition-colors duration-300 transform hover:scale-105"
            >
                Enviar para o Blogger
            </button>
        </form>
    </div>

    <script>
    function sendEmail() {
        const btn = document.querySelector('button[type="button"]');
        btn.disabled = true;
        btn.textContent = 'Enviando...';

        emailjs.send('service_vxod09i', 'template_ify492s', {
            titulo: document.getElementById('titulo').value,
            conteudo: document.getElementById('conteudo').value,
            _replyto: 'euestradaonzeteste@blogger.com'  // Adiciona cabeçalho Reply-To
        }).then(
            (response) => {
                alert(`✅ Enviado! ID: ${response.text}`);
                btn.textContent = 'Enviar novamente';
            },
            (error) => {
                console.error('Erro detalhado:', error);
                alert(`❌ Falha: ${error.text || 'Verifique o console'}`);
                btn.textContent = 'Tentar novamente';
            }
        ).finally(() => {
            btn.disabled = false;
        });
    }
</script>

</body>
</html>
