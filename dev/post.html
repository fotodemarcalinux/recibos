<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de Postagens para Blogger</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        emailjs.init('4RbQgOdqiUQJJhn4o'); // User ID público
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .animate-pulse {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 md:p-12 rounded-2xl shadow-xl w-full max-w-2xl">
        <h1 class="text-3xl md:text-4xl font-bold text-center text-gray-800 mb-6">
            Criador de Postagens para Blogger
        </h1>
        
        <p class="text-center text-gray-600 mb-8">
            Preencha os campos abaixo para enviar o conteúdo diretamente para seu blog.
        </p>

        <form id="blog-form" class="space-y-6">
            <div>
                <label for="titulo" class="block text-gray-700 font-medium mb-2">Título da Postagem</label>
                <input 
                    type="text" 
                    id="titulo" 
                    placeholder="Ex: Minha primeira postagem no blog"
                    required 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>
            
            <div>
                <label for="conteudo" class="block text-gray-700 font-medium mb-2">Conteúdo da Postagem</label>
                <textarea 
                    id="conteudo" 
                    rows="10"
                    placeholder="Escreva o conteúdo da sua postagem aqui..."
                    required 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"
                ></textarea>
            </div>

            <div id="status-message" class="hidden text-center p-3 rounded-lg"></div>

            <button 
                type="button" 
                onclick="sendEmail()" 
                id="submit-btn"
                class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg shadow-md hover:bg-blue-700 transition-colors duration-300 flex items-center justify-center gap-2"
            >
                <svg id="spinner" class="hidden w-5 h-5 text-white animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span id="btn-text">Enviar para o Blogger</span>
            </button>
        </form>
    </div>

    <script>
    async function sendEmail() {
        const btn = document.getElementById('submit-btn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btn-text');
        const statusMsg = document.getElementById('status-message');

        // Reset e preparação UI
        statusMsg.classList.add('hidden');
        btn.disabled = true;
        spinner.classList.remove('hidden');
        btnText.textContent = 'Enviando...';

        try {
            const response = await emailjs.send('service_vxod09i', 'template_ify492s', {
                titulo: document.getElementById('titulo').value,
                conteudo: document.getElementById('conteudo').value,
                _replyto: 'euestradaonze.teste@blogger.com',
                _smtp_secure: true
            });

            // Sucesso
            statusMsg.textContent = '✅ Postagem enviada com sucesso!';
            statusMsg.className = 'bg-green-100 text-green-800 block';
            document.getElementById('blog-form').reset();
            
        } catch (error) {
            // Erro
            console.error('Detalhes do erro:', error);
            statusMsg.innerHTML = `❌ Erro no envio: <span class="font-mono">${error.text || 'Verifique o console'}</span>`;
            statusMsg.className = 'bg-red-100 text-red-800 block';
            
        } finally {
            // Reset UI
            spinner.classList.add('hidden');
            btnText.textContent = 'Enviar novamente';
            btn.disabled = false;
            statusMsg.classList.remove('hidden');
            
            // Scroll para mensagem
            statusMsg.scrollIntoView({ behavior: 'smooth' });
        }
    }
    </script>
</body>
</html>
