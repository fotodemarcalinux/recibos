<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de Postagens Simples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 20px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            height: 200px;
            resize: vertical;
        }
        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Criador de Postagens para o Blog</h1>
    
    <form action="SEU_ENDPOINT_AQUI" method="POST">
        
        <label for="titulo">Título da Postagem:</label>
        <input type="text" id="titulo" name="Título" placeholder="Digite o título da sua postagem" required>
        
        <label for="conteudo">Conteúdo da Postagem:</label>
        <textarea id="conteudo" name="Conteúdo" placeholder="Escreva o conteúdo da sua postagem aqui..." required></textarea>
        
        <input type="hidden" name="_subject" value="Nova Postagem para o Blog (Enviado via Criador)">
        
        <input type="hidden" name="_replyto" value="euestradaonze.teste@blogger.com">

        <button type="submit">Enviar para o E-mail</button>
    </form>
</div>

</body>
</html>
