<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador de Dados</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 30px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
        }

        .dice-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin: 30px 0;
            perspective: 1000px;
        }

        .dice {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .dice-face {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #fff;
            border: 2px solid #333;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            color: #333;
        }

        /* Posições das faces no cubo */
        .dice-face:nth-child(1) { transform: rotateX(0deg) rotateY(0deg) translateZ(50px); }
        .dice-face:nth-child(2) { transform: rotateY(90deg) translateZ(50px); }
        .dice-face:nth-child(3) { transform: rotateY(180deg) translateZ(50px); }
        .dice-face:nth-child(4) { transform: rotateY(-90deg) translateZ(50px); }
        .dice-face:nth-child(5) { transform: rotateX(90deg) translateZ(50px); }
        .dice-face:nth-child(6) { transform: rotateX(-90deg) translateZ(50px); }

        /* Rotações para exibir o resultado */
        .dice.show-1 { transform: rotateX(0deg) rotateY(0deg); }
        .dice.show-2 { transform: rotateX(0deg) rotateY(-90deg); }
        .dice.show-3 { transform: rotateX(0deg) rotateY(180deg); }
        .dice.show-4 { transform: rotateX(0deg) rotateY(90deg); }
        .dice.show-5 { transform: rotateX(90deg) rotateY(0deg); }
        .dice.show-6 { transform: rotateX(-90deg) rotateY(0deg); }

        .roll-button {
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0 5px #0056b3;
        }

        .roll-button:active {
            background-color: #0056b3;
            box-shadow: 0 2px #003d80;
            transform: translateY(3px);
        }

        .result {
            margin-top: 20px;
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1000;
        }

        .mute-button {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            background-color: #ccc;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sorteador de Dados</h1>
        <div class="dice-container">
            <div class="dice" id="dice1">
                <div class="dice-face">1</div>
                <div class="dice-face">2</div>
                <div class="dice-face">3</div>
                <div class="dice-face">4</div>
                <div class="dice-face">5</div>
                <div class="dice-face">6</div>
            </div>
            <div class="dice" id="dice2">
                <div class="dice-face">1</div>
                <div class="dice-face">2</div>
                <div class="dice-face">3</div>
                <div class="dice-face">4</div>
                <div class="dice-face">5</div>
                <div class="dice-face">6</div>
            </div>
        </div>
        <button class="roll-button" onclick="rollDice()">Jogar os Dados</button>
        <div class="result" id="result"></div>
    </div>
    
    <button class="mute-button" id="mute-button">Mudo: Desativado</button>
    <div class="confetti-container" id="confetti-container"></div>
    
    <audio id="dice-sound" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <script>
        let isMuted = false;

        document.getElementById('mute-button').addEventListener('click', () => {
            isMuted = !isMuted;
            const muteButton = document.getElementById('mute-button');
            muteButton.textContent = `Mudo: ${isMuted ? 'Ativado' : 'Desativado'}`;
        });

        function rollDice() {
            const dice1 = document.getElementById('dice1');
            const dice2 = document.getElementById('dice2');
            const resultDiv = document.getElementById('result');
            const confettiContainer = document.getElementById('confetti-container');
            const diceSound = document.getElementById('dice-sound');
            
            if (!isMuted) {
                diceSound.currentTime = 0;
                diceSound.play();
            }

            const roll1 = Math.floor(Math.random() * 6) + 1;
            const roll2 = Math.floor(Math.random() * 6) + 1;

            // Remove as classes de rotação para iniciar a animação
            dice1.classList.remove('show-1', 'show-2', 'show-3', 'show-4', 'show-5', 'show-6');
            dice2.classList.remove('show-1', 'show-2', 'show-3', 'show-4', 'show-5', 'show-6');

            // Adiciona uma pequena rotação inicial aleatória para a animação
            dice1.style.transform = `rotateX(${Math.random() * 3600}deg) rotateY(${Math.random() * 3600}deg)`;
            dice2.style.transform = `rotateX(${Math.random() * 3600}deg) rotateY(${Math.random() * 3600}deg)`;

            // Aguarda a animação inicial para aplicar o resultado
            setTimeout(() => {
                dice1.classList.add(`show-${roll1}`);
                dice2.classList.add(`show-${roll2}`);

                // Exibe o resultado e lança os confetes
                setTimeout(() => {
                    resultDiv.innerHTML = `O resultado é: ${roll1 + roll2}`;
                    
                    if (roll1 + roll2) {
                        launchConfetti(confettiContainer);
                    }
                }, 1500);
            }, 50);
        }

        function launchConfetti(container) {
            const colors = ['#f4d35e', '#f25f5c', '#007bff', '#70c1b3', '#5a3b5d'];
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.style.width = '10px';
                confetti.style.height = '10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.position = 'absolute';
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.top = `${Math.random() * 100}vh`;
                confetti.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 360}deg)`;
                confetti.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
                container.appendChild(confetti);
            }

            const styleSheet = document.createElement('style');
            styleSheet.innerHTML = `@keyframes fall {
                0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
                100% { transform: translateY(100vh) rotate(1080deg); opacity: 0; }
            }`;
            document.head.appendChild(styleSheet);

            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
