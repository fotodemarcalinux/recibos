<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Fotos Profissional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .crop-container {
            position: relative;
            display: inline-block;
            cursor: crosshair;
        }
        .crop-overlay {
            position: absolute;
            border: 2px dashed #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            pointer-events: none;
        }
        .resize-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #3b82f6;
            border: 2px solid white;
            cursor: nw-resize;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-900 via-blue-900 to-indigo-900 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">📸 Editor de Fotos</h1>
            <p class="text-blue-200">Recorte, redimensione e aplique filtros incríveis</p>
        </div>

        <!-- Upload Area -->
        <div class="text-center mb-6">
            <input type="file" id="imageInput" accept="image/*" class="hidden">
            <label for="imageInput" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium cursor-pointer transition-colors">
                📁 Carregar Foto
            </label>
        </div>

        <!-- Editor Interface -->
        <div id="editorInterface" class="hidden">
            <!-- Toolbar Compacta -->
            <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-3 mb-4">
                <div class="flex flex-wrap justify-center gap-2">
                    <button id="cropBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg font-medium transition-colors text-xs">
                        ✂️ Recortar
                    </button>
                    <button id="resizeBtn" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg font-medium transition-colors text-xs">
                        📏 Redimensionar
                    </button>
                    <button id="filtersBtn" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-lg font-medium transition-colors text-xs">
                        🎨 Filtros
                    </button>
                    <button id="resetBtn" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg font-medium transition-colors text-xs">
                        🔄 Resetar
                    </button>
                    <button id="downloadBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg font-medium transition-colors text-xs">
                        💾 Baixar
                    </button>
                </div>
            </div>

            <!-- Image Preview - Foco Principal -->
            <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-4 mb-4">
                <div class="bg-white/5 rounded-xl p-3 text-center">
                    <div id="imageContainer" class="inline-block">
                        <canvas id="imageCanvas" class="max-w-full max-h-[70vh] h-auto rounded-lg shadow-lg"></canvas>
                    </div>
                </div>
            </div>

            <!-- Panels de Controle (Suspensos) -->
            <div class="space-y-3">

                <!-- Crop Instructions -->
                <div id="cropInstructions" class="hidden bg-white/10 backdrop-blur-lg rounded-xl p-3">
                    <div class="bg-blue-600/20 border border-blue-400 rounded-lg p-3">
                        <p class="text-blue-200 text-xs mb-2">
                            ✂️ Clique e arraste na imagem para selecionar a área
                        </p>
                        <div class="flex gap-2">
                            <button id="applyCrop" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs transition-colors">
                                Aplicar
                            </button>
                            <button id="cancelCrop" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white px-3 py-1 rounded text-xs transition-colors">
                                Cancelar
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Resize Controls -->
                <div id="resizeControls" class="hidden bg-white/10 backdrop-blur-lg rounded-xl p-4">
                    <div class="grid grid-cols-3 gap-3 items-end">
                        <div>
                            <label class="block text-blue-200 text-xs mb-1">Largura</label>
                            <input type="number" id="widthInput" class="w-full px-2 py-1 bg-white/20 text-white rounded text-sm border border-blue-300">
                        </div>
                        <div>
                            <label class="block text-blue-200 text-xs mb-1">Altura</label>
                            <input type="number" id="heightInput" class="w-full px-2 py-1 bg-white/20 text-white rounded text-sm border border-blue-300">
                        </div>
                        <button id="applyResize" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded font-medium transition-colors text-xs">
                            Aplicar
                        </button>
                    </div>
                </div>

                <!-- Filter Controls -->
                <div id="filterControls" class="hidden bg-white/10 backdrop-blur-lg rounded-xl p-4">
                    <!-- Quick Filters -->
                    <div class="mb-4">
                        <div class="flex flex-wrap justify-center gap-2 mb-3">
                            <button class="filter-preset bg-gray-600 hover:bg-gray-700 text-white px-3 py-1 rounded text-xs transition-colors" data-filter="grayscale(100%)">
                                P&B
                            </button>
                            <button class="filter-preset bg-yellow-600 hover:bg-yellow-700 text-white px-3 py-1 rounded text-xs transition-colors" data-filter="sepia(100%)">
                                Sépia
                            </button>
                            <button class="filter-preset bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs transition-colors" data-filter="hue-rotate(180deg)">
                                Invertido
                            </button>
                            <button class="filter-preset bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-xs transition-colors" data-filter="contrast(150%) saturate(150%)">
                                Vibrante
                            </button>
                        </div>
                    </div>

                    <!-- Sliders -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-blue-200 text-xs mb-1">Brilho</label>
                            <input type="range" id="brightnessSlider" min="0" max="200" value="100" class="w-full">
                            <span id="brightnessValue" class="text-blue-200 text-xs">100%</span>
                        </div>
                        <div>
                            <label class="block text-blue-200 text-xs mb-1">Contraste</label>
                            <input type="range" id="contrastSlider" min="0" max="200" value="100" class="w-full">
                            <span id="contrastValue" class="text-blue-200 text-xs">100%</span>
                        </div>
                        <div>
                            <label class="block text-blue-200 text-xs mb-1">Saturação</label>
                            <input type="range" id="saturationSlider" min="0" max="200" value="100" class="w-full">
                            <span id="saturationValue" class="text-blue-200 text-xs">100%</span>
                        </div>
                        <div>
                            <label class="block text-blue-200 text-xs mb-1">Desfoque</label>
                            <input type="range" id="blurSlider" min="0" max="10" value="0" class="w-full">
                            <span id="blurValue" class="text-blue-200 text-xs">0px</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let canvas, ctx, originalImageData, currentImageData;
        let cropMode = false, cropStart = null, cropEnd = null;
        let currentFilters = {
            brightness: 100,
            contrast: 100,
            saturation: 100,
            blur: 0,
            custom: ''
        };

        // Initialize
        document.getElementById('imageInput').addEventListener('change', loadImage);
        document.getElementById('cropBtn').addEventListener('click', toggleCropMode);
        document.getElementById('resizeBtn').addEventListener('click', toggleResizeControls);
        document.getElementById('filtersBtn').addEventListener('click', toggleFilterControls);
        document.getElementById('resetBtn').addEventListener('click', resetImage);
        document.getElementById('downloadBtn').addEventListener('click', downloadImage);
        document.getElementById('applyResize').addEventListener('click', applyResize);
        document.getElementById('applyCrop').addEventListener('click', applyCrop);
        document.getElementById('cancelCrop').addEventListener('click', cancelCrop);

        // Filter sliders
        document.getElementById('brightnessSlider').addEventListener('input', updateFilters);
        document.getElementById('contrastSlider').addEventListener('input', updateFilters);
        document.getElementById('saturationSlider').addEventListener('input', updateFilters);
        document.getElementById('blurSlider').addEventListener('input', updateFilters);

        // Filter presets
        document.querySelectorAll('.filter-preset').forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentFilters.custom = e.target.dataset.filter;
                applyFilters();
            });
        });

        function loadImage(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    canvas = document.getElementById('imageCanvas');
                    ctx = canvas.getContext('2d');
                    
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    ctx.drawImage(img, 0, 0);
                    originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    
                    document.getElementById('editorInterface').classList.remove('hidden');
                    document.getElementById('widthInput').value = img.width;
                    document.getElementById('heightInput').value = img.height;
                    
                    setupCropEvents();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function setupCropEvents() {
            canvas.addEventListener('mousedown', startCrop);
            canvas.addEventListener('mousemove', updateCrop);
            canvas.addEventListener('mouseup', endCrop);
        }

        function toggleCropMode() {
            cropMode = !cropMode;
            const instructions = document.getElementById('cropInstructions');
            const btn = document.getElementById('cropBtn');
            
            if (cropMode) {
                instructions.classList.remove('hidden');
                btn.textContent = '✂️ Sair do Recorte';
                btn.classList.add('bg-red-600', 'hover:bg-red-700');
                btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                canvas.style.cursor = 'crosshair';
            } else {
                instructions.classList.add('hidden');
                btn.textContent = '✂️ Recortar';
                btn.classList.remove('bg-red-600', 'hover:bg-red-700');
                btn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                canvas.style.cursor = 'default';
                clearCropOverlay();
            }
        }

        function startCrop(e) {
            if (!cropMode) return;
            const rect = canvas.getBoundingClientRect();
            cropStart = {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function updateCrop(e) {
            if (!cropMode || !cropStart) return;
            const rect = canvas.getBoundingClientRect();
            cropEnd = {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
            drawCropOverlay();
        }

        function endCrop(e) {
            if (!cropMode || !cropStart) return;
            const rect = canvas.getBoundingClientRect();
            cropEnd = {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function drawCropOverlay() {
            if (!cropStart || !cropEnd) return;
            
            // Redraw image
            ctx.putImageData(currentImageData, 0, 0);
            applyFilters();
            
            // Draw crop overlay
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(
                Math.min(cropStart.x, cropEnd.x),
                Math.min(cropStart.y, cropEnd.y),
                Math.abs(cropEnd.x - cropStart.x),
                Math.abs(cropEnd.y - cropStart.y)
            );
            ctx.setLineDash([]);
        }

        function applyCrop() {
            if (!cropStart || !cropEnd) return;
            
            const x = Math.min(cropStart.x, cropEnd.x);
            const y = Math.min(cropStart.y, cropEnd.y);
            const width = Math.abs(cropEnd.x - cropStart.x);
            const height = Math.abs(cropEnd.y - cropStart.y);
            
            const croppedData = ctx.getImageData(x, y, width, height);
            
            canvas.width = width;
            canvas.height = height;
            ctx.putImageData(croppedData, 0, 0);
            
            currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            document.getElementById('widthInput').value = width;
            document.getElementById('heightInput').value = height;
            
            toggleCropMode();
            clearCropOverlay();
        }

        function cancelCrop() {
            toggleCropMode();
            clearCropOverlay();
        }

        function clearCropOverlay() {
            cropStart = null;
            cropEnd = null;
            ctx.putImageData(currentImageData, 0, 0);
            applyFilters();
        }

        function toggleResizeControls() {
            const controls = document.getElementById('resizeControls');
            controls.classList.toggle('hidden');
        }

        function toggleFilterControls() {
            const controls = document.getElementById('filterControls');
            controls.classList.toggle('hidden');
        }

        function applyResize() {
            const newWidth = parseInt(document.getElementById('widthInput').value);
            const newHeight = parseInt(document.getElementById('heightInput').value);
            
            if (!newWidth || !newHeight) return;
            
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            tempCtx.putImageData(currentImageData, 0, 0);
            
            canvas.width = newWidth;
            canvas.height = newHeight;
            
            ctx.drawImage(tempCanvas, 0, 0, newWidth, newHeight);
            currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            applyFilters();
        }

        function updateFilters() {
            currentFilters.brightness = document.getElementById('brightnessSlider').value;
            currentFilters.contrast = document.getElementById('contrastSlider').value;
            currentFilters.saturation = document.getElementById('saturationSlider').value;
            currentFilters.blur = document.getElementById('blurSlider').value;
            
            document.getElementById('brightnessValue').textContent = currentFilters.brightness + '%';
            document.getElementById('contrastValue').textContent = currentFilters.contrast + '%';
            document.getElementById('saturationValue').textContent = currentFilters.saturation + '%';
            document.getElementById('blurValue').textContent = currentFilters.blur + 'px';
            
            applyFilters();
        }

        function applyFilters() {
            ctx.putImageData(currentImageData, 0, 0);
            
            const filterString = `
                brightness(${currentFilters.brightness}%)
                contrast(${currentFilters.contrast}%)
                saturate(${currentFilters.saturation}%)
                blur(${currentFilters.blur}px)
                ${currentFilters.custom}
            `;
            
            canvas.style.filter = filterString;
        }

        function resetImage() {
            if (!originalImageData) return;
            
            canvas.width = originalImageData.width;
            canvas.height = originalImageData.height;
            ctx.putImageData(originalImageData, 0, 0);
            currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            // Reset filters
            currentFilters = { brightness: 100, contrast: 100, saturation: 100, blur: 0, custom: '' };
            document.getElementById('brightnessSlider').value = 100;
            document.getElementById('contrastSlider').value = 100;
            document.getElementById('saturationSlider').value = 100;
            document.getElementById('blurSlider').value = 0;
            
            canvas.style.filter = 'none';
            
            document.getElementById('widthInput').value = canvas.width;
            document.getElementById('heightInput').value = canvas.height;
            
            updateFilters();
        }

        function downloadImage() {
            // Create a temporary canvas to capture the filtered image
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            
            // Apply filters to the temporary canvas
            tempCtx.filter = canvas.style.filter;
            tempCtx.drawImage(canvas, 0, 0);
            
            // Download
            const link = document.createElement('a');
            link.download = 'foto-editada.png';
            link.href = tempCanvas.toDataURL();
            link.click();
        }
    </script>

</html>
